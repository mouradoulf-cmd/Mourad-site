<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ชาวนาตัวน้อย — ต้นข้าวต้นแรก</title>
<style>
@font-face{font-family:K;font-weight:700;src:url(kanit-thai-700-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:K;font-weight:700;src:url(kanit-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:K;font-weight:500;src:url(kanit-thai-500-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:K;font-weight:500;src:url(kanit-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:K,sans-serif}
svg{position:absolute;inset:0;display:block}
.sub{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);padding:14px 38px 18px;border-radius:40px;
 background:rgba(20,24,30,.62);color:#fff;font-weight:500;font-size:50px;line-height:1.25;white-space:nowrap;opacity:0;
 text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sub.boy{color:#FFE27A}
.sub .who{font-size:34px;opacity:.85;margin-right:14px;color:#9FE0FF}
#title,#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.t1{font-weight:700;font-size:170px;color:#FFF6D8;-webkit-text-stroke:10px #6B3A1E;paint-order:stroke fill;
 text-shadow:0 12px 0 #3E2210,0 22px 40px rgba(0,0,0,.35);letter-spacing:2px;line-height:1.15}
.t2{margin-top:10px;font-weight:500;font-size:64px;color:#fff;background:#D9453B;padding:6px 40px 12px;border-radius:50px;
 box-shadow:0 8px 0 #8E2A22}
.e1{font-weight:700;font-size:220px;color:#FFE27A;-webkit-text-stroke:12px #6B3A1E;paint-order:stroke fill;text-shadow:0 14px 0 #3E2210}
.e2{font-weight:500;font-size:60px;color:#fff;margin-top:6px;text-shadow:0 4px 0 rgba(0,0,0,.4)}
#black{position:absolute;inset:0;background:#000;opacity:0}
#endBg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(40,20,10,.72),rgba(40,20,10,.35) 60%,rgba(0,0,0,.15));opacity:0}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EC6F0"/><stop offset=".7" stop-color="#BFE8F7"/><stop offset="1" stop-color="#FFF4D6"/></linearGradient>
 <linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B6FB5"/><stop offset=".45" stop-color="#F29A8E"/><stop offset=".8" stop-color="#FFD08A"/><stop offset="1" stop-color="#FFF0C9"/></linearGradient>
 <linearGradient id="gStorm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E6B7C"/><stop offset="1" stop-color="#A9B6C2"/></linearGradient>
 <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7A25A"/><stop offset=".55" stop-color="#FFD27E"/><stop offset="1" stop-color="#FFF1C4"/></linearGradient>
 <radialGradient id="gSun"><stop offset="0" stop-color="#FFF7C2"/><stop offset=".35" stop-color="#FFE066" stop-opacity=".9"/><stop offset="1" stop-color="#FFB84D" stop-opacity="0"/></radialGradient>
 <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ED7D2"/><stop offset="1" stop-color="#4F9CA6"/></linearGradient>
 <linearGradient id="gMud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A6A45"/><stop offset="1" stop-color="#6B4F33"/></linearGradient>
 <pattern id="pPaka" width="24" height="14" patternUnits="userSpaceOnUse"><rect width="24" height="14" fill="#D9453B"/><rect x="0" width="6" height="14" fill="#F4E6D8" opacity=".85"/><rect y="5" width="24" height="4" fill="#9E2A22" opacity=".6"/></pattern>
 <clipPath id="cGold"><rect id="goldClip" x="0" y="0" width="0" height="1080"/></clipPath>
 <clipPath id="cFrame"><rect width="1920" height="1080"/></clipPath>
</defs>
<g clip-path="url(#cFrame)">
<g id="world">
 <rect width="1920" height="1080" fill="url(#gDay)"/>
 <rect id="skyDawn" width="1920" height="1080" fill="url(#gDawn)"/>
 <rect id="skyStorm" width="1920" height="1080" fill="url(#gStorm)" opacity="0"/>
 <rect id="skyGold" width="1920" height="1080" fill="url(#gGold)" opacity="0"/>
 <g id="rainbow" opacity="0"></g>
 <g id="sun"><circle r="230" fill="url(#gSun)"/><circle r="92" fill="#FFE45C"/><circle r="92" fill="none" stroke="#FFC93C" stroke-width="10"/></g>
 <g id="mountains"></g>
 <g id="clouds"></g>
 <g id="storm" opacity="0"></g>
 <g id="land">
  <g id="village"></g>
  <g id="fieldGreen"></g>
  <g id="fieldGold" clip-path="url(#cGold)"></g>
  <g id="dike"></g>
  <g id="birds"></g>
  <g id="buffWide"></g>
  <g id="boyWide"></g>
  <g id="hearts"></g>
  <g id="front"></g>
 </g>
 <g id="close" opacity="0">
  <g id="bank"></g>
  <rect x="0" y="640" width="1920" height="440" fill="url(#gWater)"/>
  <g id="ripplesBg"></g>
  <g id="plant"></g>
  <g id="rings"></g>
  <g id="boyClose"></g>
  <rect x="0" y="905" width="1920" height="175" fill="#5AA6AE" opacity=".78"/>
  <g id="waterLines"></g>
  <g id="sparkles"></g>
 </g>
 <g id="rain" opacity="0"></g>
</g>
</g>
</svg>
<div id="title"><div class="t1" id="t1">ชาวนาตัวน้อย</div><div class="t2" id="t2">ตอน ต้นข้าวต้นแรก</div></div>
<div id="subs"></div>
<div id="endBg"></div>
<div id="end"><div class="e1" id="e1">จบ</div><div class="e2" id="e2">ติดตามตอนต่อไปนะ</div></div>
<div id="black"></div>
</div>
<script src="gsap.min.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(tag,attrs,parent,html){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

/* ---------- decor ---------- */
function cloud(p,x,y,s,col){const g=el('g',{transform:`translate(${x},${y}) scale(${s})`},p);
 [[0,0,70],[70,-25,85],[150,0,70],[75,20,75],[-50,15,50],[200,18,48]].forEach(([cx,cy,r])=>el('circle',{cx,cy,r,fill:col},g));return g;}
function mountains(){const m=$('mountains');
 el('path',{d:'M0,720 L0,560 Q180,430 360,540 Q520,380 720,520 Q900,410 1080,530 Q1280,400 1480,520 Q1680,430 1920,540 L1920,720Z',fill:'#8FB9C9'},m);
 el('path',{d:'M0,720 L0,610 Q240,520 480,600 Q700,520 960,610 Q1200,530 1440,600 Q1700,520 1920,600 L1920,720Z',fill:'#79AE8F'},m);}
function palm(p,x,y,h,s){const g=el('g',{transform:`translate(${x},${y}) scale(${s})`},p);
 el('path',{d:`M-7,0 L-4,${-h} L4,${-h} L7,0Z`,fill:'#6B4A2E'},g);
 const c=el('g',{transform:`translate(0,${-h})`},g);
 for(let i=0;i<14;i++){const a=i/14*Math.PI*2;el('path',{d:`M0,0 L${Math.cos(a-0.12)*55},${Math.sin(a-0.12)*40} L${Math.cos(a)*78},${Math.sin(a)*58} L${Math.cos(a+0.12)*55},${Math.sin(a+0.12)*40}Z`,fill:i%2?'#2F7D3A':'#3F9447'},c);}
 el('circle',{r:14,fill:'#2A6B31'},c);return g;}
function house(p,x,y,s){const g=el('g',{transform:`translate(${x},${y}) scale(${s})`},p);
 [-70,-25,25,70].forEach(sx=>el('rect',{x:sx-5,y:-60,width:10,height:60,fill:'#5B3B22'},g));
 el('rect',{x:-90,y:-150,width:180,height:92,fill:'#A8743F'},g);
 for(let i=0;i<9;i++)el('rect',{x:-90+i*20,y:-150,width:3,height:92,fill:'#8B5E30'},g);
 el('rect',{x:-20,y:-125,width:40,height:67,fill:'#5B3B22'},g);
 el('path',{d:'M-120,-146 L0,-265 L120,-146Z',fill:'#8A3B24'},g);
 el('path',{d:'M-120,-146 L0,-265 L120,-146',fill:'none',stroke:'#5E2616','stroke-width':8},g);
 el('path',{d:'M0,-265 q-6,-24 12,-34',fill:'none',stroke:'#5E2616','stroke-width':7,'stroke-linecap':'round'},g);
 el('rect',{x:-100,y:-64,width:200,height:8,fill:'#5B3B22'},g);return g;}
function field(p,base,tuft,grain){
 el('rect',{x:0,y:688,width:1920,height:392,fill:base},p);
 let y=700,row=0;
 while(y<1100){const sz=10+(y-690)/10;let d='';
  for(let x=-40+(row%2)*sz;x<1960;x+=sz*1.6){d+=`M${x},${y} l${sz*.35},${-sz*1.6} l${sz*.3},${sz*1.2} l${sz*.25},${-sz*1.9} l${sz*.25},${sz*1.9} l${sz*.3},${-sz*1.2} l${sz*.35},${sz*1.6}Z `;}
  el('path',{d,fill:tuft},p);
  if(grain){for(let x=(row%2)*sz;x<1920;x+=sz*3.2)el('circle',{cx:x+sz*.8,cy:y-sz*1.9,r:sz*.16,fill:grain},p);}
  y+=sz*1.15;row++;}}
function dike(){const d=$('dike');
 el('path',{d:'M-20,835 Q480,800 960,818 T1940,812 L1940,872 Q1440,880 960,876 T-20,892Z',fill:'#C19A67'},d);
 el('path',{d:'M-20,835 Q480,800 960,818 T1940,812',fill:'none',stroke:'#D8B988','stroke-width':6},d);
 for(let i=0;i<40;i++){const x=i*50+rnd()*20;el('path',{d:`M${x},${878+rnd()*8} l6,-16 l6,14 l6,-20 l6,20`,fill:'#6FAF4B'},d);}}

/* ---------- characters ---------- */
function boy(p,id){const B=el('g',{id},p);const body=el('g',{id:id+'_body'},B);
 const legL=el('g',{id:id+'_legL'},body),legR=el('g',{id:id+'_legR'},body);
 el('rect',{x:-26,y:-72,width:17,height:70,rx:8,fill:'#E9B27E'},legL);el('ellipse',{cx:-18,cy:-2,rx:16,ry:7,fill:'#6B3A1E'},legL);
 el('rect',{x:9,y:-72,width:17,height:70,rx:8,fill:'#E9B27E'},legR);el('ellipse',{cx:18,cy:-2,rx:16,ry:7,fill:'#6B3A1E'},legR);
 el('path',{d:'M-38,-112 L38,-112 L40,-66 L4,-66 L0,-80 L-4,-66 L-40,-66Z',fill:'#5B3A29'},body);
 const armL=el('g',{id:id+'_armL'},body),armR=el('g',{id:id+'_armR'},body);
 el('rect',{x:-58,y:-186,width:24,height:78,rx:12,fill:'#E9B27E'},armL);el('rect',{x:-58,y:-188,width:24,height:36,rx:10,fill:'#2E4A7D'},armL);el('circle',{cx:-46,cy:-106,r:13,fill:'#F2BE8C'},armL);
 el('rect',{x:34,y:-186,width:24,height:78,rx:12,fill:'#E9B27E'},armR);el('rect',{x:34,y:-188,width:24,height:36,rx:10,fill:'#2E4A7D'},armR);el('circle',{cx:46,cy:-106,r:13,fill:'#F2BE8C'},armR);
 el('rect',{x:-42,y:-194,width:84,height:92,rx:22,fill:'#2E4A7D'},body);
 el('path',{d:'M-16,-194 L0,-170 L16,-194',fill:'none',stroke:'#1F3358','stroke-width':6,'stroke-linejoin':'round'},body);
 el('rect',{x:-44,y:-122,width:88,height:16,rx:6,fill:'url(#pPaka)'},body);
 el('path',{d:'M26,-110 l14,34 l-16,-6Z',fill:'#D9453B'},body);
 const head=el('g',{id:id+'_head'},body);
 el('circle',{cx:-60,cy:-252,r:15,fill:'#F2BE8C'},head);el('circle',{cx:60,cy:-252,r:15,fill:'#F2BE8C'},head);
 el('circle',{cx:0,cy:-255,r:63,fill:'#F5C896'},head);
 el('path',{d:'M-58,-270 Q-40,-318 0,-316 Q42,-318 58,-270 Q30,-292 12,-282 Q0,-296 -14,-282 Q-34,-294 -58,-270Z',fill:'#2B1D14'},head);
 el('path',{d:'M-34,-280 q10,-6 20,0 M14,-280 q10,-6 20,0',fill:'none',stroke:'#2B1D14','stroke-width':5,'stroke-linecap':'round'},head);
 const eyes=el('g',{id:id+'_eyes'},head);
 [[-23],[23]].forEach(([x])=>{el('ellipse',{cx:x,cy:-256,rx:10,ry:14,fill:'#1D1410'},eyes);el('circle',{cx:x+3,cy:-261,r:4,fill:'#fff'},eyes);});
 el('ellipse',{cx:-40,cy:-232,rx:12,ry:8,fill:'#F28B82',opacity:.6},head);el('ellipse',{cx:40,cy:-232,rx:12,ry:8,fill:'#F28B82',opacity:.6},head);
 el('path',{d:'M-3,-242 q3,4 6,0',fill:'none',stroke:'#C98B5E','stroke-width':3},head);
 el('path',{id:id+'_mC',d:'M-16,-226 Q0,-212 16,-226',fill:'none',stroke:'#7A2E24','stroke-width':5,'stroke-linecap':'round'},head);
 const mO=el('g',{id:id+'_mO',opacity:0},head);
 el('path',{d:'M-16,-229 Q0,-200 16,-229Z',fill:'#8B2E2E'},mO);el('ellipse',{cx:0,cy:-212,rx:7,ry:4,fill:'#E77A7A'},mO);
 const hat=el('g',{id:id+'_hat'},head);
 el('path',{d:'M-128,-292 Q0,-392 128,-292 Q0,-270 -128,-292Z',fill:'#E3B35F'},hat);
 el('path',{d:'M-128,-292 Q0,-270 128,-292',fill:'none',stroke:'#B9843A','stroke-width':6},hat);
 for(let i=-3;i<=3;i++)el('path',{d:`M${i*34},${-285+Math.abs(i)*2} L0,-362`,stroke:'#C9934A','stroke-width':3},hat);
 el('path',{d:'M-70,-302 Q0,-330 70,-302',fill:'none',stroke:'#D9453B','stroke-width':8},hat);
 return B;}
function buffalo(p,id){const B=el('g',{id},p);const body=el('g',{id:id+'_body'},B);
 const tail=el('g',{id:id+'_tail'},body);el('path',{d:'M-160,-150 Q-205,-120 -196,-62',fill:'none',stroke:'#56626F','stroke-width':9,'stroke-linecap':'round'},tail);el('ellipse',{cx:-196,cy:-56,rx:10,ry:16,fill:'#3E4852'},tail);
 const legs=[];[[-118,'a'],[-78,'b'],[72,'c'],[112,'d']].forEach(([x,k])=>{const g=el('g',{id:id+'_leg'+k},body);el('rect',{x:x-14,y:-80,width:28,height:78,rx:10,fill:k=='b'||k=='d'?'#4F5A66':'#5B6775'},g);el('rect',{x:x-15,y:-14,width:30,height:14,rx:5,fill:'#2F363D'},g);legs.push(g);});
 el('ellipse',{cx:0,cy:-128,rx:172,ry:86,fill:'#6D7A8C'},body);
 el('ellipse',{cx:10,cy:-98,rx:120,ry:42,fill:'#8592A3'},body);
 const head=el('g',{id:id+'_head'},body);
 el('ellipse',{cx:190,cy:-185,rx:72,ry:60,fill:'#768498'},head);
 el('ellipse',{cx:125,cy:-218,rx:30,ry:14,fill:'#5E6B7C',transform:'rotate(-25 125 -218)'},head);
 el('ellipse',{cx:252,cy:-222,rx:28,ry:13,fill:'#5E6B7C',transform:'rotate(25 252 -222)'},head);
 el('path',{d:'M150,-228 Q70,-262 92,-196 Q98,-238 160,-214Z',fill:'#F1E7D3'},head);
 el('path',{d:'M228,-228 Q308,-262 286,-196 Q280,-238 218,-214Z',fill:'#F1E7D3'},head);
 el('ellipse',{cx:200,cy:-150,rx:48,ry:32,fill:'#E9ABA6'},head);
 el('ellipse',{cx:184,cy:-150,rx:7,ry:9,fill:'#8E4D4A'},head);el('ellipse',{cx:216,cy:-150,rx:7,ry:9,fill:'#8E4D4A'},head);
 const eyes=el('g',{id:id+'_eyes'},head);
 [[166],[214]].forEach(([x])=>{el('ellipse',{cx:x,cy:-196,rx:9,ry:12,fill:'#1D1410'},eyes);el('circle',{cx:x+3,cy:-200,r:3.5,fill:'#fff'},eyes);});
 el('path',{d:'M172,-122 Q190,-100 212,-122',fill:'none',stroke:'#A0B0C0','stroke-width':6},head);
 el('circle',{cx:192,cy:-104,r:14,fill:'#F2C14E',stroke:'#B98A1E','stroke-width':4},head);
 return B;}
function plant(p){const g=el('g',{id:'pl'},p);
 const leaves=[['M0,0 C-4,-60 -30,-110 -70,-150','#4CAF50'],['M0,0 C4,-70 30,-120 64,-170','#5CBF5A'],['M0,0 C0,-80 -6,-150 -2,-200','#43A047'],
  ['M0,0 C-10,-50 -60,-80 -110,-95','#66BB6A'],['M0,0 C10,-55 60,-90 110,-110','#4CAF50'],['M0,0 C-2,-90 -40,-170 -48,-230','#57B85A'],['M0,0 C2,-95 40,-180 36,-240','#3E9B45']];
 leaves.forEach(([d,c],i)=>el('path',{id:'lf'+i,d,fill:'none',stroke:c,'stroke-width':12,'stroke-linecap':'round'},g));
 const gr=el('g',{id:'grains',opacity:0},g);
 [[-48,-230],[36,-240],[-2,-200]].forEach(([x,y],k)=>{for(let i=0;i<7;i++)el('ellipse',{cx:x+(k?4:-4)*i*0.9,cy:y+i*13,rx:7,ry:11,fill:'#F2B632',stroke:'#C88A12','stroke-width':2},gr);});
 return g;}

/* ---------- build scene ---------- */
mountains();
cloud($('clouds'),150,190,1,'#fff').id='c1';cloud($('clouds'),1300,140,1.2,'#fff').id='c2';cloud($('clouds'),760,300,.7,'#fff').id='c3';
const st=$('storm');[[-100,170,1.8],[500,120,2.1],[1150,180,1.9],[1650,110,1.7],[250,300,1.5],[1400,320,1.6]].forEach(([x,y,s])=>cloud(st,x,y,s,'#7D8896'));
const rb=$('rainbow');['#E8505B','#F59E42','#F7D154','#6BC96B','#4DA6E8','#8C6BD9'].forEach((c,i)=>el('path',{class:'rbArc',d:`M${260+i*26},900 A${700-i*26},${620-i*26} 0 0 1 ${1660-i*26},900`,fill:'none',stroke:c,'stroke-width':26,opacity:.75,'pathLength':1,'stroke-dasharray':1,'stroke-dashoffset':1},rb));
const V=$('village');palm(V,180,700,300,1);palm(V,300,705,240,.9);house(V,560,700,.9);palm(V,1560,700,320,1);house(V,1330,705,.75);palm(V,1760,705,250,.85);palm(V,980,700,200,.7);
field($('fieldGreen'),'#8BCF5E','#5FAF45',null);field($('fieldGold'),'#F2C14E','#D99A26','#FFE08A');dike();
const fr=$('front');for(let i=0;i<22;i++){const x=i*92+rnd()*40;el('path',{d:`M${x},1085 l14,-70 l12,56 l14,-90 l14,90 l12,-56 l14,70Z`,fill:i%2?'#4E9E3C':'#5DB049'},fr);}
boy($('boyWide'),'bw');buffalo($('buffWide'),'fw');
const hs=$('hearts');for(let i=0;i<5;i++){const hg=el('g',{transform:`translate(${1000+i*40},560)`},hs);el('path',{class:'heart',d:'M0,0 C-20,-22 -44,4 0,34 C44,4 20,-22 0,0Z',fill:'#FF6B8A',opacity:0},hg);}
const bd=$('birds');for(let i=0;i<5;i++){const g=el('g',{class:'bird'},bd);el('path',{class:'wing',d:'M-26,0 Q-13,-16 0,0 Q13,-16 26,0',fill:'none',stroke:'#3B3B4F','stroke-width':6,'stroke-linecap':'round'},g);}
/* close-up */
const bk=$('bank');el('rect',{x:0,y:600,width:1920,height:60,fill:'#7DBF5A'},bk);for(let x=0;x<1920;x+=38)el('path',{d:`M${x},640 l8,-40 l6,32 l8,-52 l8,52 l6,-32 l8,40Z`,fill:'#4F9E3E'},bk);
const rbg=$('ripplesBg');for(let i=0;i<14;i++)el('ellipse',{cx:rnd()*1920,cy:700+rnd()*200,rx:60+rnd()*80,ry:6,fill:'#fff',opacity:.18},rbg);
plant($('plant'));
const rg=$('rings');for(let i=0;i<3;i++)el('ellipse',{class:'ring',cx:960,cy:905,rx:40,ry:10,fill:'none',stroke:'#fff','stroke-width':5,opacity:0},rg);
boy($('boyClose'),'bc');
const wl=$('waterLines');for(let i=0;i<9;i++)el('path',{class:'wl',d:`M${i*230-60},${930+(i%3)*40} q40,-10 80,0 t80,0`,fill:'none',stroke:'#fff','stroke-width':4,opacity:.35},wl);
const sp=$('sparkles');for(let i=0;i<12;i++){const a=i/12*Math.PI*2;el('path',{class:'spk',d:'M0,-22 L6,-6 L22,0 L6,6 L0,22 L-6,6 L-22,0 L-6,-6Z',fill:'#FFF3A6',opacity:0,transform:`translate(${960+Math.cos(a)*210},${720+Math.sin(a)*170})`},sp);}
const rn=$('rain');for(let i=0;i<150;i++){const X=rnd()*2100,Y=-60-rnd()*1100;el('line',{class:'drop',x1:X,y1:Y,x2:X-10,y2:Y+42,stroke:'#DDEBFA','stroke-width':4,'stroke-linecap':'round',opacity:.8},rn);}

/* subtitles */
const SUBS=[
