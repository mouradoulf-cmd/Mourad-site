# Publishes only the jongngai/ folder to GitHub Pages.
# One-time setup in the repo: Settings > Pages > Source = "GitHub Actions".
name: Deploy jongngai to Pages
on:
  push:
    branches: [main]
    paths: ['jongngai/**', '.github/workflows/pages-jongngai.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: jongngai
      - id: deployment
        uses: actions/deploy-pages@v4
