# NM Studio — dish photo fetcher (used by the photo-plat skill).
# Claude's cloud sandbox cannot reach Unsplash, GitHub's runners can. Two steps, both driven by files in the repo:
#  1. menus/assets/dishes/requests.txt  — one line per dish: "slug|search words"
#     → saves up to 12 small preview candidates (free Unsplash photos only, no Unsplash+) in
#       menus/assets/dishes/_candidates/<slug>/ with candidates.json (id, description, photographer, page URL).
#  2. menus/assets/dishes/picks.txt     — one line per chosen photo: "slug|unsplash-photo-id"
#     → downloads that photo at 1600 px into menus/assets/dishes/_picked/<slug>.jpg (Claude crops/encodes it).
name: dish-photos
on:
  push:
    paths:
      - "menus/assets/dishes/requests.txt"
      - "menus/assets/dishes/picks.txt"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search and download
        run: |
          set -u
          D=menus/assets/dishes
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          mkdir -p "$D/_candidates" "$D/_picked"
          if [ -f "$D/requests.txt" ]; then
            while IFS='|' read -r slug query; do
              slug=$(echo "$slug" | tr -d '[:space:]'); [ -z "$slug" ] && continue
              [ -f "$D/_candidates/$slug/candidates.json" ] && continue
              mkdir -p "$D/_candidates/$slug"
              q=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1].strip()))' "$query")
              curl -sSL -A "$UA" "https://unsplash.com/napi/search/photos?query=$q&per_page=30" -o /tmp/s.json || true
              python3 - "$D/_candidates/$slug" <<'PY'
          import json, sys, urllib.request
          out = sys.argv[1]
          try: data = json.load(open("/tmp/s.json"))
          except Exception as e:
              json.dump({"error": str(e)}, open(out + "/candidates.json", "w")); sys.exit(0)
          keep = []
          for r in data.get("results", []):
              if r.get("premium") or r.get("plus") or "plus.unsplash.com" in r.get("urls", {}).get("raw", ""): continue
              keep.append({"n": len(keep) + 1, "id": r["id"], "desc": r.get("alt_description") or r.get("description"),
                           "by": (r.get("user") or {}).get("name"), "page": (r.get("links") or {}).get("html"),
                           "w": r.get("width"), "h": r.get("height"), "raw": r["urls"]["raw"]})
              if len(keep) == 12: break
          for c in keep:
              url = c["raw"] + ("&" if "?" in c["raw"] else "?") + "w=480&q=70&fm=jpg"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              open(f'{out}/{c["n"]:02d}.jpg', "wb").write(urllib.request.urlopen(req, timeout=60).read())
          json.dump(keep, open(out + "/candidates.json", "w"), ensure_ascii=False, indent=1)
          print(out, len(keep))
          PY
            done < "$D/requests.txt"
          fi
          if [ -f "$D/picks.txt" ]; then
            while IFS='|' read -r slug id; do
              slug=$(echo "$slug" | tr -d '[:space:]'); id=$(echo "$id" | tr -d '[:space:]'); [ -z "$slug" ] && continue
              [ -f "$D/_picked/$slug.jpg" ] && continue
              raw=$(python3 -c 'import json,sys;c=[x for x in json.load(open(sys.argv[1])) if x["id"]==sys.argv[2]];print(c[0]["raw"] if c else "")' "$D/_candidates/$slug/candidates.json" "$id" 2>/dev/null || true)
              [ -z "$raw" ] && raw="https://images.unsplash.com/photo-$id"
              curl -sSL -A "$UA" "$raw&w=1600&q=85&fm=jpg" -o "$D/_picked/$slug.jpg" || rm -f "$D/_picked/$slug.jpg"
            done < "$D/picks.txt"
          fi
      - name: Commit
        run: |
          git config user.name "dish-photos bot"
          git config user.email "actions@users.noreply.github.com"
          git add menus/assets/dishes
          git diff --cached --quiet || git commit -m "Photos de plats : candidates / photo choisie (automatique)"
          git push
