<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baan Suan Thai Kitchen — Digital menu (sample by NM Studio)</title>
<meta name="description" content="Sample digital restaurant menu by NM Studio: 4 languages, animated, QR-ready.">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06161a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06161a; --bg2: #0a2227; --card: rgba(255,255,255,.055); --line: rgba(255,255,255,.1);
    --gold: #e9c46a; --gold2: #f4dc9c; --coral: #ff6b4a; --teal: #2dd4bf; --ink: #f4f1ea; --dim: #a9b8b8;
    --serif: "Playfair Display", "Noto Serif Thai", "Noto Sans SC", serif;
    --sans: "Onest", "Noto Sans Thai", "Noto Sans SC", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; overflow-x: hidden; min-height: 100vh; }
  html[lang="th"] body { font-family: "Noto Sans Thai", var(--sans); }
  html[lang="zh"] body { font-family: "Noto Sans SC", var(--sans); }

  /* ---------- animated ambient background (calm, not distracting) ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% -10%, #0e3a40 0%, var(--bg) 60%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
  .blob--1 { width: 60vmax; height: 60vmax; left: -20vmax; top: -10vmax; background: radial-gradient(circle, rgba(45,212,191,.38), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
  .blob--2 { width: 55vmax; height: 55vmax; right: -22vmax; top: 30vh; background: radial-gradient(circle, rgba(255,107,74,.3), transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
  .blob--3 { width: 50vmax; height: 50vmax; left: 10vmax; bottom: -25vmax; background: radial-gradient(circle, rgba(233,196,106,.26), transparent 65%); animation: drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate3d(12vmax, 8vmax, 0) scale(1.1); } }
  @keyframes drift2 { to { transform: translate3d(-14vmax, -6vmax, 0) scale(.95); } }
  @keyframes drift3 { to { transform: translate3d(10vmax, -10vmax, 0) scale(1.12); } }
  .grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
  .lantern { position: absolute; bottom: -20px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold2); box-shadow: 0 0 14px 5px rgba(233,196,106,.55); opacity: 0; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 12% { opacity: .75; } 100% { transform: translateY(-110vh) translateX(var(--dx, 20px)); opacity: 0; } }

  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 16px calc(90px + env(safe-area-inset-bottom)); }

  /* ---------- hero ---------- */
  .hero { text-align: center; padding: calc(34px + env(safe-area-inset-top)) 8px 22px; }
  .demo-pill { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--gold2); border: 1px solid rgba(233,196,106,.45); background: rgba(233,196,106,.08); }
  .logo { margin: 18px auto 0; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, #1a5a60, #0a2a2f); box-shadow: 0 0 0 1px rgba(233,196,106,.6), 0 0 30px rgba(233,196,106,.25); }
  .logo svg { width: 32px; height: 32px; }
  .hero h1 { margin-top: 14px; font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 8.2vw, 40px); line-height: 1.15; letter-spacing: .01em; }
  .hero h1 em { font-style: italic; color: var(--gold2); font-weight: 500; }
  .hero .tag { margin-top: 8px; color: var(--dim); font-size: 14px; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px auto 0; color: var(--gold); }
  .orn i { display: block; width: 54px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn i:last-child { transform: scaleX(-1); }
  .langs { margin: 20px auto 0; display: inline-flex; padding: 4px; gap: 2px; border-radius: 99px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px var(--line); backdrop-filter: blur(8px); }
  .langs button { border: 0; background: transparent; color: var(--dim); font: inherit; font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 99px; cursor: pointer; min-height: 38px; transition: .25s; }
  .langs button[aria-pressed="true"] { background: linear-gradient(135deg, var(--gold), #f6b94a); color: #2a1d05; box-shadow: 0 4px 14px rgba(233,196,106,.35); }

  /* ---------- sticky tabs ---------- */
  .tabs { position: sticky; top: 0; z-index: 30; margin: 0 -16px 8px; padding: 10px 16px; background: linear-gradient(180deg, rgba(6,22,26,.96), rgba(6,22,26,.78)); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .tabs__row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .tabs__row::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 13.5px; color: var(--dim); background: rgba(255,255,255,.06); padding: 9px 15px; border-radius: 99px; min-height: 40px; box-shadow: inset 0 0 0 1px var(--line); transition: .25s; white-space: nowrap; }
  .tab[aria-current="true"] { color: #2a1d05; background: linear-gradient(135deg, var(--gold2), var(--gold)); box-shadow: 0 4px 16px rgba(233,196,106,.3); }

  /* ---------- sections & cards ---------- */
  section.cat { padding-top: 26px; }
  .cat h2 { display: flex; align-items: center; gap: 12px; font-family: var(--serif); font-weight: 600; font-size: 26px; letter-spacing: .01em; }
  .cat h2 small { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; }
  .cat h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(233,196,106,.6), transparent); }
  .dish { position: relative; display: flex; gap: 14px; width: 100%; text-align: left; margin-top: 12px; padding: 12px 14px 12px 12px; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 22px; background: linear-gradient(135deg, rgba(255,255,255,.085), rgba(255,255,255,.03)); box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
  .dish:active { transform: scale(.985); }
  @media (hover: hover) { .dish:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 1px rgba(233,196,106,.45), 0 16px 40px rgba(0,0,0,.35); } }
  .art { flex: none; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.2), rgba(255,255,255,.04) 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 8px 22px rgba(0,0,0,.35); }
  .art svg { width: 112px; height: 112px; overflow: visible; margin: -6px 0 -4px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .nm { font-family: var(--serif); font-weight: 600; font-size: 17.5px; line-height: 1.25; }
  .nm2 { margin-top: 1px; font-family: "Noto Serif Thai", var(--serif); font-size: 12.5px; color: var(--gold); }
  .ds { margin-top: 5px; font-size: 12.8px; line-height: 1.45; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: auto; padding-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .price { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--gold2); margin-right: auto; }
  .price span { font-size: 12px; font-weight: 500; margin-right: 1px; opacity: .85; }
  .chili { display: inline-flex; gap: 2px; }
  .chili svg { width: 13px; height: 13px; }
  .chip { font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; }
  .chip--pick { background: linear-gradient(135deg, var(--coral), #ff9a5c); color: #fff; }
  .chip--veg { color: #6ee7a8; box-shadow: inset 0 0 0 1px rgba(110,231,168,.6); }

  /* steam */
  .steam path { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2.2; stroke-linecap: round; opacity: 0; animation: steam 3.4s ease-in-out infinite; }
  .steam path:nth-child(2) { animation-delay: 1.1s; } .steam path:nth-child(3) { animation-delay: 2.1s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 35% { opacity: .75; } 100% { opacity: 0; transform: translateY(-10px); } }

  /* reveal (visible by default; hidden state only enabled once the observer works) */
  .js-reveal .dish { opacity: 0; transform: translateY(18px); }
  .js-reveal .dish.in { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }

  /* ---------- bottom sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto; border-radius: 28px 28px 0 0; padding: 12px 22px calc(26px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, #123238, #0a1f24); box-shadow: 0 -20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(233,196,106,.45); transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.9,.2,1); }
  .sheet.on { transform: none; }
  .grab { width: 44px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.25); margin: 0 auto 12px; }
  .sheet .big { width: 150px; height: 150px; margin: 4px auto 0; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.22), rgba(255,255,255,.04) 70%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 14px 40px rgba(0,0,0,.45); }
  .sheet .big svg { width: 176px; height: 176px; overflow: visible; margin-top: -8px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .sheet h3 { margin-top: 14px; text-align: center; font-family: var(--serif); font-weight: 600; font-size: 25px; line-height: 1.2; }
  .sheet .th { text-align: center; margin-top: 3px; color: var(--gold); font-family: "Noto Serif Thai", var(--serif); }
  .sheet .row { margin-top: 12px; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sheet p.long { margin-top: 14px; color: #d4dede; font-size: 15px; line-height: 1.6; text-align: center; }
  .box { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; }
  .box b { color: var(--gold2); font-weight: 600; margin-right: 6px; }
  .close { display: block; width: 100%; margin-top: 18px; min-height: 48px; border-radius: 99px; border: 0; cursor: pointer; font: inherit; font-weight: 700; color: #2a1d05; background: linear-gradient(135deg, var(--gold2), var(--gold)); }

  /* ---------- footer / CTA ---------- */
  .legend { margin-top: 30px; text-align: center; font-size: 12px; color: var(--dim); }
  .legend .chili { vertical-align: -2px; margin: 0 4px; }
  .cta { margin-top: 22px; padding: 18px; text-align: center; border-radius: 22px; background: linear-gradient(135deg, rgba(34,232,255,.1), rgba(168,85,247,.12), rgba(236,72,153,.12)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .cta b { display: block; font-size: 15px; }
  .cta span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--dim); }
  .cta a { display: inline-block; margin-top: 12px; padding: 11px 22px; border-radius: 99px; text-decoration: none; font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(90deg, #22b7d6, #a855f7, #ec4899); }

  @media (prefers-reduced-motion: reduce) {
    .blob, .lantern, .steam path { animation: none !important; }
    .lantern { display: none; }
    .steam path { opacity: .35; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob blob--1"></div><div class="blob blob--2"></div><div class="blob blob--3"></div>
  <div class="grain"></div>
  <div id="lanterns"></div>
</div>

<div class="wrap">
  <header class="hero">
    <span class="demo-pill" id="demoPill">SAMPLE MENU · BY NM STUDIO</span>
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 3c-1.5 3-5.5 5.5-5.5 10.2A5.5 5.5 0 0016 18.7a5.5 5.5 0 005.5-5.5C21.5 8.5 17.5 6 16 3z" fill="url(#lg)"/><path d="M6 22h20M8.5 26h15" stroke="#e9c46a" stroke-width="1.8" stroke-linecap="round"/><defs><linearGradient id="lg" x1="16" y1="3" x2="16" y2="19"><stop stop-color="#f4dc9c"/><stop offset="1" stop-color="#ff6b4a"/></linearGradient></defs></svg>
    </div>
    <h1>Baan Suan<br><em>Thai Kitchen</em></h1>
    <p class="tag" id="tagline">Authentic Thai flavours, cooked to order</p>
    <div class="orn"><i></i><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 0l1.6 5.4L14 7l-5.4 1.6L7 14l-1.6-5.4L0 7l5.4-1.6z" fill="currentColor"/></svg><i></i></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-l="en" aria-pressed="true">EN</button><button data-l="th" aria-pressed="false">ไทย</button><button data-l="zh" aria-pressed="false">中文</button><button data-l="fr" aria-pressed="false">FR</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Menu categories"><div class="tabs__row" id="tabs"></div></nav>
  <main id="menu"></main>

  <p class="legend" id="legend"></p>
  <div class="cta" id="cta"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dish details"></aside>

<script>
(function () {
  /* ================== ILLUSTRATIONS (hand-built SVG, no photos needed) ================== */
  var uid = 0;
  function G(a, b) { var id = 'g' + (++uid); return { id: id, def: '<radialGradient id="' + id + '" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/></radialGradient>' }; }
  var STEAM = '<g class="steam"><path d="M46 28c-6-6 6-10 0-18"/><path d="M60 26c-6-6 6-10 0-18"/><path d="M74 28c-6-6 6-10 0-18"/></g>';
  function porcelain() { return '<linearGradient id="pc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#d6cdb9"/></linearGradient>'; }
  function wrap(inner, defs) { return '<svg viewBox="0 0 120 120" aria-hidden="true"><defs>' + porcelain() + (defs || '') + '</defs>' + inner + '</svg>'; }
  function shadow() { return '<ellipse cx="60" cy="104" rx="42" ry="6" fill="rgba(0,0,0,.35)"/>'; }
  function bowl(c1, c2, garnish, steam) {
    var g = G(c1, c2);
    return wrap(shadow() +
      '<path d="M14 56Q14 102 60 102T106 56Z" fill="url(#pc)"/><path d="M20 70Q60 80 100 70" stroke="#e9c46a" stroke-width="2" fill="none" opacity=".9"/>' +
      '<ellipse cx="60" cy="56" rx="46" ry="13" fill="#f3ecdc"/><ellipse cx="60" cy="57" rx="40" ry="10.5" fill="url(#' + g.id + ')"/>' + garnish + (steam ? STEAM : ''), g.def);
  }
  function plate(inner) {
    return wrap(shadow() + '<ellipse cx="60" cy="68" rx="48" ry="19" fill="url(#pc)"/><ellipse cx="60" cy="66" rx="38" ry="13" fill="#efe7d4"/>' + inner);
  }
  var lime = '<g transform="translate(88 66)"><ellipse rx="9" ry="6" fill="#b6e36b"/><ellipse rx="6.5" ry="3.8" fill="#d9f59a"/><path d="M-6 0h12M0 -3.6v7.2" stroke="#b6e36b" stroke-width=".8"/></g>';
  var herb = function (x, y, r) { return '<ellipse cx="' + x + '" cy="' + y + '" rx="5" ry="2.6" transform="rotate(' + (r || 0) + ' ' + x + ' ' + y + ')" fill="#4ca85a"/>'; };
  var chiliS = function (x, y, r) { return '<path d="M' + x + ' ' + y + 'q6 -1 9 4q-6 1 -9 -4z" transform="rotate(' + (r || 0) + ' ' + x + ' ' + y + ')" fill="#e5484d"/>'; };
  var shrimp = function (x, y, r) { return '<path d="M' + x + ' ' + y + 'q8 -9 14 -1q3 6 -3 8q-5 -2 -2 -5q-4 -4 -9 -2z" transform="rotate(' + (r || 0) + ' ' + x + ' ' + y + ')" fill="#ff9d7a"/>'; };

  var ART = {
    tomyum: function () { return bowl('#ff7a3d', '#c93a1e', shrimp(44, 58, -10) + shrimp(70, 60, 15) + herb(58, 55, 20) + herb(82, 57, -30) + chiliS(52, 63, 0) + '<circle cx="64" cy="64" r="2" fill="#fff6c9"/>', true); },
    curry: function () { return bowl('#b6d96a', '#5c9a34', '<ellipse cx="48" cy="59" rx="7" ry="4.2" fill="#f1e2c4"/><ellipse cx="68" cy="57" rx="7" ry="4.2" fill="#f1e2c4"/><circle cx="82" cy="60" r="3.2" fill="#8bc34a"/><circle cx="55" cy="64" r="3" fill="#8bc34a"/>' + herb(60, 55, 10) + chiliS(76, 63, 20), true); },
    massaman: function () { return bowl('#c9803a', '#7a3f14', '<rect x="42" y="55" width="11" height="8" rx="3" fill="#8a4a22"/><rect x="62" y="58" width="11" height="8" rx="3" fill="#8a4a22"/><circle cx="80" cy="60" r="4.5" fill="#f1d28b"/><circle cx="52" cy="66" r="3" fill="#e9c46a"/><circle cx="72" cy="55" r="1.6" fill="#f4dc9c"/><circle cx="46" cy="60" r="1.6" fill="#f4dc9c"/>', true); },
    khaosoi: function () { return bowl('#f3a43c', '#c46a14', '<path d="M42 58c6-4 12 4 18 0s12 4 18 0" stroke="#fff0b8" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M46 63c6-3 10 3 16 0s10 3 14 0" stroke="#ffe08a" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M60 50l4 6M66 49l-1 7" stroke="#e8c26a" stroke-width="2" stroke-linecap="round"/>' + herb(80, 58, -15), true); },
    somtam: function () { return bowl('#f0e7c9', '#c9b37e', '<path d="M38 56l14 4M44 62l16-3M56 55l12 6M64 61l14-4M72 55l10 5" stroke="#bfe27a" stroke-width="2.6" stroke-linecap="round"/><path d="M42 58l10-3M60 62l10 2M74 62l8-4" stroke="#ff9a4d" stroke-width="2.6" stroke-linecap="round"/><circle cx="52" cy="60" r="4.2" fill="#e5484d"/><circle cx="70" cy="56" r="3.6" fill="#e5484d"/><circle cx="62" cy="58" r="1.6" fill="#b88a4a"/><circle cx="46" cy="64" r="1.6" fill="#b88a4a"/><circle cx="80" cy="62" r="1.6" fill="#b88a4a"/>', false); },

    { c: 'dr', a: 'coconut', p: 70, s: 0, veg: 1, al: [], n: { en: 'Fresh Coconut', th: 'มะพร้าวน้ำหอม', zh: '鲜椰子', fr: 'Noix de coco fraîche' }, d: { en: 'A whole young coconut, chilled — pure and refreshing.', th: 'มะพร้าวน้ำหอมแช่เย็นทั้งลูก หวานสดชื่น', zh: '整颗冰镇嫩椰子，清爽解渴。', fr: 'Une noix de coco jeune entière, bien fraîche — pure et désaltérante.' } }
  ];
  var ORDER = ['st', 'ma', 'nr', 'de', 'dr'];
  var WA = 'https://wa.me/qr/PYPOVXTCVM74I1';
  var lang = 'en', io = null, spy = null;

  function chili(n) { var s = ''; for (var i = 0; i < n; i++) s += CHILI; return n ? '<span class="chili" aria-label="' + UI[lang].spice + ' ' + n + '/3">' + s + '</span>' : ''; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function render() {
    var T = UI[lang];
    document.documentElement.lang = lang;
    document.getElementById('demoPill').textContent = T.demo;
    document.getElementById('tagline').textContent = T.tag;
    var h = '', tabs = '';
    ORDER.forEach(function (c) {
      tabs += '<button class="tab" data-c="' + c + '">' + T.cat[c] + '</button>';
      h += '<section class="cat" id="c-' + c + '"><h2>' + T.cat[c] + (lang !== 'en' ? '<small>' + UI.en.cat[c] + '</small>' : '') + '</h2>';
      D.forEach(function (d, i) {
        if (d.c !== c) return;
        h += '<button class="dish" data-i="' + i + '"><div class="art">' + ART[d.a]() + '</div><div class="info"><div class="nm">' + esc(d.n[lang]) + '</div>' +
          (lang !== 'th' ? '<div class="nm2">' + esc(d.n.th) + '</div>' : '') + '<div class="ds">' + esc(d.d[lang]) + '</div>' +
          '<div class="meta"><span class="price"><span>฿</span>' + d.p + '</span>' + chili(d.s) + (d.veg ? '<span class="chip chip--veg">' + T.veg + '</span>' : '') + (d.pick ? '<span class="chip chip--pick">' + T.chef + '</span>' : '') + '</div></div></button>';
      });
      h += '</section>';
    });
    document.getElementById('tabs').innerHTML = tabs;
    document.getElementById('menu').innerHTML = h;
    document.getElementById('legend').innerHTML = chili(1) + chili(2).replace(/<span class="chili"/, '<span class="chili"') + ' ' + T.spice + ' · ' + T.legend;
    document.getElementById('cta').innerHTML = '<b>' + T.cta1 + '</b><span>' + T.cta2 + '</span><a href="' + WA + '" target="_blank" rel="noopener">' + T.cta3 + '</a>';
    [].forEach.call(document.querySelectorAll('.langs button'), function (b) { b.setAttribute('aria-pressed', b.dataset.l === lang ? 'true' : 'false'); });
    observe();
  }

  /* reveal on scroll — hidden state is only switched on once the observer is confirmed working */
  function observe() {
    if (io) io.disconnect();
    var els = document.querySelectorAll('.dish');
    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.documentElement.classList.add('js-reveal');
    io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -6% 0px', threshold: .05 });
    [].forEach.call(els, function (e, k) { e.style.transitionDelay = (k % 3) * 70 + 'ms'; io.observe(e); });
    setTimeout(function () { [].forEach.call(document.querySelectorAll('.dish:not(.in)'), function (e) { var r = e.getBoundingClientRect(); if (r.top < innerHeight) e.classList.add('in'); }); }, 900);
    setupSpy();
  }
  function setupSpy() {
    if (spy) spy.disconnect();
    spy = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) mark(e.target.id.slice(2)); }); }, { rootMargin: '-30% 0px -60% 0px' });
    [].forEach.call(document.querySelectorAll('section.cat'), function (s) { spy.observe(s); });
    mark(ORDER[0]);
  }
  function mark(c) {
    [].forEach.call(document.querySelectorAll('.tab'), function (t) {
      var on = t.dataset.c === c; t.setAttribute('aria-current', on ? 'true' : 'false');
      if (on) { var row = document.getElementById('tabs'); row.scrollTo({ left: t.offsetLeft - row.clientWidth / 2 + t.clientWidth / 2, behavior: 'smooth' }); }
    });
  }

  /* bottom sheet */
  function openSheet(i) {
    var d = D[i], T = UI[lang];
    var al = d.al.length ? '<div class="box"><b>' + T.contains + '</b>' + d.al.map(function (a) { return ALG[a][lang]; }).join(', ') + '</div>' : '';
    document.getElementById('sheet').innerHTML = '<div class="grab"></div><div class="big">' + ART[d.a]() + '</div><h3>' + esc(d.n[lang]) + '</h3>' + (lang !== 'th' ? '<div class="th">' + esc(d.n.th) + '</div>' : '') +
      '<div class="row"><span class="price"><span>฿</span>' + d.p + '</span>' + chili(d.s) + (d.veg ? '<span class="chip chip--veg">' + T.veg + '</span>' : '') + (d.pick ? '<span class="chip chip--pick">' + T.chef + '</span>' : '') + '</div>' +
      '<p class="long">' + esc(d.d[lang]) + '</p>' + (d.s ? '<div class="box"><b>' + T.spice + '</b>' + d.s + ' / 3</div>' : '') + al + '<button class="close" id="cl">' + T.close + '</button>';
    document.getElementById('scrim').classList.add('on'); document.getElementById('sheet').classList.add('on');
    document.getElementById('cl').onclick = closeSheet;
  }
  function closeSheet() { document.getElementById('scrim').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); }
  document.getElementById('scrim').onclick = closeSheet;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('.dish'); if (t) { openSheet(+t.dataset.i); return; }
    var tb = e.target.closest('.tab'); if (tb) { document.getElementById('c-' + tb.dataset.c).scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var lb = e.target.closest('.langs button'); if (lb) { lang = lb.dataset.l; try { localStorage.setItem('nm_menu_lang', lang); } catch (x) {} render(); }
  });

  /* ambient lanterns */
  (function () {
    var box = document.getElementById('lanterns'); if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < 12; i++) { var l = document.createElement('i'); l.className = 'lantern'; l.style.left = (Math.random() * 100) + '%'; l.style.animationDuration = (16 + Math.random() * 18) + 's'; l.style.animationDelay = (-Math.random() * 30) + 's'; l.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px'); var s = 3 + Math.random() * 4; l.style.width = l.style.height = s + 'px'; box.appendChild(l); }
  })();

  /* start language: saved choice, else phone language */
  try { var sv = localStorage.getItem('nm_menu_lang'); if (sv && UI[sv]) lang = sv; else { var n = (navigator.language || 'en').slice(0, 2); if (UI[n]) lang = n; } } catch (x) {}
  var q = new URLSearchParams(location.search).get('lang'); if (q && UI[q]) lang = q;
  render();
})();
</script>
