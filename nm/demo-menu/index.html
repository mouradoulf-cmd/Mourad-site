    --art-a: #ffffff; --art-b: rgba(0,0,0,.05); --tabs-a: rgba(255,255,255,.97); --tabs-b: rgba(255,255,255,.9); --sheet-a: #ffffff; --sheet-b: #f5f5f5;
    --btn-ink: #fff; --veg: #2c8556; --logo-a: #2b2b2b; --logo-b: #111; --shadow: rgba(0,0,0,.1); --scrim: rgba(0,0,0,.4); --steam: rgba(100,100,100,.55); --lantern: #c8372d; --grain: .02; }
  html[data-theme="charcoal"] { --bg: #111214; --glow: #212226; --b1: rgba(255,255,255,.07); --b2: rgba(212,175,90,.13); --b3: rgba(255,255,255,.05);
    --gold: #d4af5a; --gold2: #ecd08a; --gold-rgb: 212,175,90; --accent: #b88a2e; --accent2: #d6a84a; --cta-ink: #1a1203; --ink: #f4f1ea; --dim: #a6a6aa; --long: #dcdcdc;
    --tabs-a: rgba(17,18,20,.96); --tabs-b: rgba(17,18,20,.8); --sheet-a: #1f2024; --sheet-b: #111214; --btn-ink: #1a1203; --logo-a: #3a3a3e; --logo-b: #161618; }
  html[data-theme="blackred"] { --bg: #0e0b0b; --glow: #2c1011; --b1: rgba(200,40,40,.28); --b2: rgba(212,175,90,.18); --b3: rgba(200,40,40,.16);
    --accent: #c8281f; --accent2: #e8503f; --dim: #c2aaa6; --long: #ecdedb; --tabs-a: rgba(14,11,11,.96); --tabs-b: rgba(14,11,11,.8); --sheet-a: #261113; --sheet-b: #120a0a; --logo-a: #7a1f1f; --logo-b: #2a0c0c; }

    --art-a: rgba(255,255,255,.92); --art-b: rgba(80,50,30,.06); --tabs-a: rgba(239,227,207,.97); --tabs-b: rgba(239,227,207,.86); --sheet-a: #fbf3e4; --sheet-b: #efe1c8;
    --btn-ink: #fff; --veg: #3e7d4f; --logo-a: #8a4a2a; --logo-b: #4a2412; --shadow: rgba(90,60,30,.18); --scrim: rgba(40,25,10,.45); --steam: rgba(120,100,90,.6); --lantern: #b8793f; --grain: .04; }
  html[data-theme="sage"] { --bg: #e8eee4; --glow: #f7fbf4; --b1: rgba(110,160,120,.2); --b2: rgba(230,200,140,.2); --b3: rgba(255,255,255,.45);
    --gold: #4f7a52; --gold2: #2f5a36; --gold-rgb: 79,122,82; --accent: #c0613a; --accent2: #dd8556; --cta-ink: #fff;
    --ink: #1f2d22; --dim: #566a5b; --long: #34463a; --card-a: rgba(255,255,255,.9); --card-b: rgba(255,255,255,.66); --line: rgba(30,50,35,.13); --glass: rgba(30,50,35,.06);
    --art-a: rgba(255,255,255,.95); --art-b: rgba(30,50,35,.06); --tabs-a: rgba(232,238,228,.97); --tabs-b: rgba(232,238,228,.86); --sheet-a: #f8fbf5; --sheet-b: #e4ecdf;
    --btn-ink: #fff; --veg: #2c8556; --logo-a: #4f7a52; --logo-b: #254a2c; --shadow: rgba(40,70,45,.15); --scrim: rgba(20,35,25,.45); --steam: rgba(100,115,105,.6); --lantern: #6a9a6e; --grain: .04; }
  html[data-theme="teak"] { --bg: #1c130c; --glow: #3c2816; --b1: rgba(214,130,50,.3); --b2: rgba(217,178,95,.22); --b3: rgba(120,70,30,.3);
    --gold: #e0a752; --gold2: #f4cd88; --gold-rgb: 224,167,82; --accent: #d0662c; --accent2: #ee8c4a; --ink: #f7ecdc; --dim: #c6af94; --long: #eadbc4;
    --tabs-a: rgba(28,19,12,.96); --tabs-b: rgba(28,19,12,.8); --sheet-a: #36230f; --sheet-b: #1a1008; --logo-a: #6a3f1a; --logo-b: #2a1a0c; }
  html[data-theme="ocean"] { --bg: #f3f8fb; --glow: #ffffff; --b1: rgba(60,140,200,.2); --b2: rgba(255,140,100,.16); --b3: rgba(255,255,255,.5);
    --gold: #1c6aa5; --gold2: #0f4c7c; --gold-rgb: 28,106,165; --accent: #e0603f; --accent2: #f08a62; --cta-ink: #fff;
    --ink: #12283a; --dim: #52687a; --long: #2a4256; --card-a: rgba(255,255,255,.96); --card-b: rgba(255,255,255,.72); --line: rgba(18,40,58,.12); --glass: rgba(18,40,58,.05);
    --art-a: rgba(255,255,255,.96); --art-b: rgba(18,40,58,.06); --tabs-a: rgba(243,248,251,.97); --tabs-b: rgba(243,248,251,.88); --sheet-a: #ffffff; --sheet-b: #e8f1f7;
    --btn-ink: #fff; --veg: #2c8556; --logo-a: #2a7ab5; --logo-b: #0f3b60; --shadow: rgba(20,60,90,.14); --scrim: rgba(10,30,45,.45); --steam: rgba(90,110,125,.6); --lantern: #3c8cc8; --grain: .03; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; overflow-x: hidden; min-height: 100vh; }
  html[lang="th"] body { font-family: "Noto Sans Thai", var(--sans); }
  html[lang="zh"] body { font-family: "Noto Sans SC", var(--sans); }
  html[lang="ko"] body { font-family: "Noto Sans KR", var(--sans); }
  html[lang="hi"] body { font-family: "Noto Sans Devanagari", var(--sans); }

  /* ---------- animated ambient background (calm, not distracting) ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% -10%, var(--glow) 0%, var(--bg) 60%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
  .blob--1 { width: 60vmax; height: 60vmax; left: -20vmax; top: -10vmax; background: radial-gradient(circle, var(--b1), transparent 65%); animation: drift1 26s ease-in-out infinite alternate; }
  .blob--2 { width: 55vmax; height: 55vmax; right: -22vmax; top: 30vh; background: radial-gradient(circle, var(--b2), transparent 65%); animation: drift2 32s ease-in-out infinite alternate; }
  .blob--3 { width: 50vmax; height: 50vmax; left: 10vmax; bottom: -25vmax; background: radial-gradient(circle, var(--b3), transparent 65%); animation: drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate3d(12vmax, 8vmax, 0) scale(1.1); } }
  @keyframes drift2 { to { transform: translate3d(-14vmax, -6vmax, 0) scale(.95); } }
  @keyframes drift3 { to { transform: translate3d(10vmax, -10vmax, 0) scale(1.12); } }
  .grain { position: absolute; inset: 0; opacity: var(--grain); mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
  .lantern { position: absolute; bottom: -20px; width: 6px; height: 6px; border-radius: 50%; background: var(--lantern); box-shadow: 0 0 14px 5px rgba(var(--gold-rgb),.5); opacity: 0; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 12% { opacity: .75; } 100% { transform: translateY(-110vh) translateX(var(--dx, 20px)); opacity: 0; } }

  html.embed { scroll-behavior: auto; }
  html.embed .cta, html.embed .legend { display: none; }
  html.embed .wrap { padding-bottom: 30px; }
  html.embed .hero { padding-top: 22px; }
  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 0 16px calc(90px + env(safe-area-inset-bottom)); }

  /* ---------- hero ---------- */
  .hero { text-align: center; padding: calc(34px + env(safe-area-inset-top)) 8px 22px; }
  .demo-pill { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--gold2); border: 1px solid rgba(var(--gold-rgb),.5); background: rgba(var(--gold-rgb),.1); }
  .logo { margin: 18px auto 0; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 30% 25%, var(--logo-a), var(--logo-b)); box-shadow: 0 0 0 1px rgba(var(--gold-rgb),.65), 0 0 30px rgba(var(--gold-rgb),.25); }
  .logo svg { width: 32px; height: 32px; }
  .hero h1 { margin-top: 14px; font-family: var(--serif); font-weight: 600; font-size: clamp(30px, 8.2vw, 40px); line-height: 1.15; letter-spacing: .01em; }
  .hero h1 em { font-style: italic; color: var(--gold2); font-weight: 500; }
  .hero .tag { margin-top: 8px; color: var(--dim); font-size: 14px; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px auto 0; color: var(--gold); }
  .orn i { display: block; width: 54px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .orn i:last-child { transform: scaleX(-1); }
  .langs { margin: 20px auto 0; display: flex; flex-wrap: wrap; justify-content: center; width: fit-content; max-width: 100%; padding: 5px; gap: 2px 1px; border-radius: 22px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); backdrop-filter: blur(8px); }
  .langs::-webkit-scrollbar { display: none; }
  .langs button { flex: none; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; border: 0; background: transparent; color: var(--dim); font: inherit; font-weight: 600; font-size: 12px; padding: 6px 9px 6px 6px; gap: 5px; border-radius: 99px; cursor: pointer; min-height: 36px; transition: .25s; }
  .fl { display: inline-flex; width: 20px; height: 14px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
  .fl svg { width: 100%; height: 100%; display: block; }
  .langs button[aria-pressed="true"] { background: linear-gradient(135deg, var(--gold2), var(--gold)); color: var(--btn-ink); box-shadow: 0 4px 14px rgba(var(--gold-rgb),.35); }

  /* ---------- sticky tabs ---------- */
  .tabs { position: sticky; top: 0; z-index: 30; margin: 0 -16px 8px; padding: 10px 16px; background: linear-gradient(180deg, var(--tabs-a), var(--tabs-b)); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .tabs__row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .tabs__row::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 13.5px; color: var(--dim); background: var(--glass); padding: 9px 15px; border-radius: 99px; min-height: 40px; box-shadow: inset 0 0 0 1px var(--line); transition: .25s; white-space: nowrap; }
  .tab[aria-current="true"] { color: var(--btn-ink); background: linear-gradient(135deg, var(--gold2), var(--gold)); box-shadow: 0 4px 16px rgba(var(--gold-rgb),.3); }

  /* ---------- sections & cards ---------- */
  section.cat { padding-top: 26px; }
  .cat h2 { display: flex; align-items: center; gap: 12px; font-family: var(--serif); font-weight: 600; font-size: 26px; letter-spacing: .01em; }
  .cat h2 small { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--gold); letter-spacing: .12em; text-transform: uppercase; }
  .cat h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(var(--gold-rgb),.6), transparent); }
  .dish { position: relative; display: flex; gap: 14px; width: 100%; text-align: left; margin-top: 12px; padding: 12px 14px 12px 12px; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 22px; background: linear-gradient(135deg, var(--card-a), var(--card-b)); box-shadow: inset 0 0 0 1px var(--line), 0 10px 30px var(--shadow); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
  .dish:active { transform: scale(.985); }
  @media (hover: hover) { .dish:hover { transform: translateY(-3px); box-shadow: inset 0 0 0 1px rgba(var(--gold-rgb),.5), 0 16px 40px var(--shadow); } }
  .art { flex: none; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, var(--art-a), var(--art-b) 70%); box-shadow: inset 0 0 0 1px var(--line), 0 8px 22px var(--shadow); }
  .art svg { width: 112px; height: 112px; overflow: visible; margin: -6px 0 -4px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .nm { font-family: var(--serif); font-weight: 600; font-size: 17.5px; line-height: 1.25; }
  .nm2 { margin-top: 1px; font-family: "Noto Serif Thai", var(--serif); font-size: 12.5px; color: var(--gold); }
  .ds { margin-top: 5px; font-size: 12.8px; line-height: 1.45; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: auto; padding-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .price { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--gold2); margin-right: auto; }
  .price span { font-size: 12px; font-weight: 500; margin-right: 1px; opacity: .85; }
  .chili { display: inline-flex; gap: 2px; }
  .chili svg { width: 13px; height: 13px; }
  .chip { font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 3px 8px; border-radius: 99px; text-transform: uppercase; }
  .chip--pick { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .chip--veg { color: var(--veg); box-shadow: inset 0 0 0 1px var(--veg); }

  /* steam */
  .steam path { fill: none; stroke: var(--steam); stroke-width: 2.2; stroke-linecap: round; opacity: 0; animation: steam 3.4s ease-in-out infinite; }
  .steam path:nth-child(2) { animation-delay: 1.1s; } .steam path:nth-child(3) { animation-delay: 2.1s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 35% { opacity: .75; } 100% { opacity: 0; transform: translateY(-10px); } }

  /* reveal (visible by default; hidden state only enabled once the observer works) */
  .js-reveal .dish { opacity: 0; transform: translateY(18px); }
  .js-reveal .dish.in { opacity: 1; transform: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }

  /* ---------- bottom sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto; border-radius: 28px 28px 0 0; padding: 12px 22px calc(26px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, var(--sheet-a), var(--sheet-b)); box-shadow: 0 -20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(var(--gold-rgb),.5); transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.9,.2,1); }
  .sheet.on { transform: none; }
  .grab { width: 44px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 12px; }
  .sheet .big { width: 150px; height: 150px; margin: 4px auto 0; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, var(--art-a), var(--art-b) 70%); box-shadow: inset 0 0 0 1px var(--line), 0 14px 40px var(--shadow); }
  .sheet .big svg { width: 176px; height: 176px; overflow: visible; margin-top: -8px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }
  .sheet h3 { margin-top: 14px; text-align: center; font-family: var(--serif); font-weight: 600; font-size: 25px; line-height: 1.2; }
  .sheet .th { text-align: center; margin-top: 3px; color: var(--gold); font-family: "Noto Serif Thai", var(--serif); }
  .sheet .row { margin-top: 12px; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sheet p.long { margin-top: 14px; color: var(--long); font-size: 15px; line-height: 1.6; text-align: center; }
  .box { margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; }
  .box b { color: var(--gold2); font-weight: 600; margin-right: 6px; }

          '<div class="meta"><span class="price"><span>฿</span>' + d.p + '</span>' + chili(d.s) + (d.veg ? '<span class="chip chip--veg">' + T.veg + '</span>' : '') + (d.pick ? '<span class="chip chip--pick">' + T.chef + '</span>' : '') + '</div></div></button>';
      });
      h += '</section>';
    });
    document.getElementById('tabs').innerHTML = tabs;
    document.getElementById('menu').innerHTML = h;
    document.getElementById('legend').innerHTML = chili(1) + chili(2).replace(/<span class="chili"/, '<span class="chili"') + ' ' + T.spice + ' · ' + T.legend;
    document.getElementById('cta').innerHTML = '<b>' + T.cta1 + '</b><span>' + T.cta2 + '</span><a href="' + WA + '" target="_blank" rel="noopener">' + T.cta3 + '</a><div class="themes"><small>' + T.colors + '</small><div class="sw" id="sw">' + THEMES.map(function (t) { return '<button data-t="' + t[0] + '" aria-label="' + t[0] + '" aria-pressed="false" style="background:linear-gradient(135deg,' + t[1] + ',' + t[2] + ')"></button>'; }).join('') + '</div></div>';
    markTheme();
    [].forEach.call(document.querySelectorAll('#langs button'), function (b) { b.setAttribute('aria-pressed', b.dataset.l === lang ? 'true' : 'false'); });
    observe();
  }

  /* reveal on scroll — hidden state is only switched on once the observer is confirmed working */
  function observe() {
    if (io) io.disconnect();
    var els = document.querySelectorAll('.dish');
    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    document.documentElement.classList.add('js-reveal');
    io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -6% 0px', threshold: .05 });
    [].forEach.call(els, function (e, k) { e.style.transitionDelay = (k % 3) * 70 + 'ms'; io.observe(e); });
    setTimeout(function () { [].forEach.call(document.querySelectorAll('.dish:not(.in)'), function (e) { var r = e.getBoundingClientRect(); if (r.top < innerHeight) e.classList.add('in'); }); }, 900);
    setupSpy();
  }
  function setupSpy() {
    if (spy) spy.disconnect();
    spy = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) mark(e.target.id.slice(2)); }); }, { rootMargin: '-30% 0px -60% 0px' });
    [].forEach.call(document.querySelectorAll('section.cat'), function (s) { spy.observe(s); });
    mark(ORDER[0]);
  }
  function mark(c) {
    [].forEach.call(document.querySelectorAll('.tab'), function (t) {
      var on = t.dataset.c === c; t.setAttribute('aria-current', on ? 'true' : 'false');
      if (on) { var row = document.getElementById('tabs'); row.scrollTo({ left: t.offsetLeft - row.clientWidth / 2 + t.clientWidth / 2, behavior: 'smooth' }); }
    });
  }

  /* bottom sheet */
  function openSheet(i) {
    var d = D[i], T = UI[lang];
    var al = d.al.length ? '<div class="box"><b>' + T.contains + '</b>' + d.al.map(function (a) { return ALG[a][lang]; }).join(', ') + '</div>' : '';
    document.getElementById('sheet').innerHTML = '<div class="grab"></div><div class="big">' + ART[d.a]() + '</div><h3>' + esc(d.n[lang]) + '</h3>' + (lang !== 'th' ? '<div class="th">' + esc(d.n.th) + '</div>' : '') +
      '<div class="row"><span class="price"><span>฿</span>' + d.p + '</span>' + chili(d.s) + (d.veg ? '<span class="chip chip--veg">' + T.veg + '</span>' : '') + (d.pick ? '<span class="chip chip--pick">' + T.chef + '</span>' : '') + '</div>' +
      '<p class="long">' + esc(d.d[lang]) + '</p>' + (d.s ? '<div class="box"><b>' + T.spice + '</b>' + d.s + ' / 3</div>' : '') + al + '<button class="close" id="cl">' + T.close + '</button>';
    document.getElementById('scrim').classList.add('on'); document.getElementById('sheet').classList.add('on');
    document.getElementById('cl').onclick = closeSheet;
  }
  function closeSheet() { document.getElementById('scrim').classList.remove('on'); document.getElementById('sheet').classList.remove('on'); }
  document.getElementById('scrim').onclick = closeSheet;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('.dish'); if (t) { openSheet(+t.dataset.i); return; }
    var tb = e.target.closest('.tab'); if (tb) { document.getElementById('c-' + tb.dataset.c).scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var sb = e.target.closest('#sw button'); if (sb) { applyTheme(sb.dataset.t); return; }
    var lb = e.target.closest('#langs button'); if (lb) { lang = lb.dataset.l; try { localStorage.setItem('nm_menu_lang', lang); } catch (x) {} render(); }
  });

  /* ambient lanterns */
  (function () {
    var box = document.getElementById('lanterns'); if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < 12; i++) { var l = document.createElement('i'); l.className = 'lantern'; l.style.left = (Math.random() * 100) + '%'; l.style.animationDuration = (16 + Math.random() * 18) + 's'; l.style.animationDelay = (-Math.random() * 30) + 's'; l.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px'); var s = 3 + Math.random() * 4; l.style.width = l.style.height = s + 'px'; box.appendChild(l); }
  })();

  /* start language: saved choice, else phone language */
  try { var sv = localStorage.getItem('nm_menu_lang'); if (sv && UI[sv]) lang = sv; else { var n = (navigator.language || 'en').slice(0, 2); if (UI[n]) lang = n; } } catch (x) {}
  var q = new URLSearchParams(location.search).get('lang'); if (q && UI[q]) lang = q;
  try { var st = localStorage.getItem('nm_menu_theme'); if (st && TCOL[st]) theme = st; } catch (x) {}
  var qt = new URLSearchParams(location.search).get('theme'); if (qt && TCOL[qt]) theme = qt;
  applyTheme(theme);
  buildLangs();
  render();
  /* embed mode (used inside the NM Studio before/after phone): slow auto-scroll, stops as soon as the visitor touches it */
  if (new URLSearchParams(location.search).get('embed') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('embed');
    var y = 0, last = 0, halted = false, dirDown = true;
    ['touchstart', 'wheel', 'mousedown', 'keydown'].forEach(function (ev) { addEventListener(ev, function () { halted = true; }, { passive: true }); });
    var tick = function (t) {
      if (halted) return;
      if (!last) last = t;
      var dt = Math.min(.1, (t - last) / 1000); last = t;
      var max = document.documentElement.scrollHeight - innerHeight;
      y += (dirDown ? 46 : -160) * dt;
      if (y >= max) { dirDown = false; } if (y <= 0) { y = 0; dirDown = true; }
      scrollTo(0, Math.round(y));
      requestAnimationFrame(tick);
    };
    setTimeout(function () { requestAnimationFrame(tick); }, 1500);
  }
})();
</script>
