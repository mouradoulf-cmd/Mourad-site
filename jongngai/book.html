<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จองคิว — จองง่าย</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="nav"><div class="container"><a class="logo" href="index.html">จอง<b>ง่าย</b></a><a class="btn btn--sm btn--ghost" href="dashboard.html">หน้าร้าน</a></div></header>
<main class="container page" style="max-width:640px">
  <h1 id="shopName" style="margin:0 0 4px"></h1>
  <p style="color:var(--muted);margin:0 0 20px">เลือกบริการและเวลาที่สะดวก</p>
  <form id="form" class="panel">
    <label>บริการ</label><div id="services" class="chips"></div>
    <label for="date">วันที่</label><input id="date" type="date" required>
    <label>เวลา</label><div id="times" class="chips"></div>
    <label for="name">ชื่อ</label><input id="name" required autocomplete="name">
    <label for="phone">เบอร์โทร</label><input id="phone" type="tel" required inputmode="tel" autocomplete="tel" pattern="[0-9\- +]{9,15}">
    <p id="err" style="color:var(--danger);margin:12px 0 0;display:none"></p>
    <button class="btn" style="width:100%;margin-top:18px" type="submit">ยืนยันการจอง</button>
  </form>
  <div id="done" class="panel" hidden>
    <div class="ok-box"><div class="tick">✅</div><h2 style="margin:8px 0">จองสำเร็จ</h2><p id="sum" style="color:var(--muted)"></p>
    <a id="lineBtn" class="btn" href="#" target="_blank" rel="noopener">ส่งรายละเอียดทาง LINE</a>
    <p><a href="book.html" style="color:var(--green-d)">จองอีกครั้ง</a></p></div>
  </div>
</main>
<script src="assets/js/store.js"></script>
<script>
(function(){
  var data=Store.get(), sel={svc:null,time:null};
  var $=function(i){return document.getElementById(i)};
  $('shopName').textContent=data.shop.name;
  var dateEl=$('date'), today=new Date(); today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
  dateEl.min=dateEl.value=today.toISOString().slice(0,10);

  function chips(el,items,key,fmt){
    el.innerHTML='';
    items.forEach(function(it){
      var b=document.createElement('button');b.type='button';b.className='chip'+(sel[key]===it.v?' on':'');b.textContent=it.t;
      if(it.off)b.disabled=true;
      b.onclick=function(){sel[key]=it.v;render();};
      el.appendChild(b);
    });
  }
  function render(){
    chips($('services'),data.services.map(function(s){return{v:s.id,t:s.name+' · ฿'+s.price}}),'svc');
    var taken=Store.taken(dateEl.value),times=[],now=new Date();
    var isToday=dateEl.value===today.toISOString().slice(0,10);
    for(var h=data.shop.open;h<data.shop.close;h++){
      var t=('0'+h).slice(-2)+':00';
      times.push({v:t,t:t,off:taken.indexOf(t)>-1||(isToday&&h<=now.getHours())});
    }
    if(sel.time&&times.some(function(x){return x.v===sel.time&&x.off}))sel.time=null;
    chips($('times'),times,'time');
  }
  dateEl.onchange=function(){sel.time=null;render();};
  $('form').onsubmit=function(e){
    e.preventDefault();
    var err=$('err');err.style.display='none';
    if(!sel.svc||!sel.time){err.textContent='กรุณาเลือกบริการและเวลา';err.style.display='block';return;}
    var svc=data.services.filter(function(s){return s.id===sel.svc})[0];
    if(Store.taken(dateEl.value).indexOf(sel.time)>-1){err.textContent='เวลานี้ถูกจองแล้ว กรุณาเลือกเวลาอื่น';err.style.display='block';render();return;}
    var b=Store.addBooking({service:svc.name,price:svc.price,date:dateEl.value,time:sel.time,name:$('name').value.trim(),phone:$('phone').value.trim()});
    var txt='จองคิว '+data.shop.name+'\n'+svc.name+'\nวันที่ '+b.date+' เวลา '+b.time+'\nชื่อ '+b.name+' โทร '+b.phone;
    $('sum').textContent=svc.name+' · '+b.date+' · '+b.time;
    $('lineBtn').href='https://line.me/R/msg/text/?'+encodeURIComponent(txt);
    $('form').hidden=true;$('done').hidden=false;
  };
  render();
})();
</script>
</body>
</html>
