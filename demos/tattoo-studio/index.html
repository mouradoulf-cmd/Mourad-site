<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0d06">
<title>Tattoo Studio | มาเก็ตตัวอย่าง</title>
<meta name="description" content="Private tattoo studio. Talk first, price before we start, a clean private room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Jost:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Design read: private irezumi-leaning tattoo studio, Pattaya locals and visitors. Dark olive + one vermilion accent.
   Shippori Mincho is chosen for the Japanese heritage of the room itself (samurai corner, kanji scrolls). Radius: 20px cards, pills for buttons, arches only as the signature motif. */
:root{--bg:#0a0d06;--bg2:#10150a;--moss:#1a2310;--ink:#efe9dc;--dim:#aaa592;--red:#d8341f;--line:rgba(239,233,220,.13);
 --ease:cubic-bezier(.32,.72,0,1);
 --display:"Shippori Mincho","Noto Serif Thai",serif;--body:"Jost","Noto Sans Thai",system-ui,sans-serif;--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--body);overflow-x:hidden;padding-bottom:84px}
html[lang=th] body{font-family:"Noto Sans Thai","Jost",sans-serif}
html[lang=th] h1,html[lang=th] h2,html[lang=th] h3{font-family:"Noto Serif Thai","Shippori Mincho",serif}
img{max-width:100%;display:block;height:auto}a{color:inherit;text-decoration:none}
.wrap{width:min(1180px,100% - 40px);margin:0 auto}
main,footer,.demo{position:relative;z-index:1}
.grain{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.prog{position:fixed;top:0;left:0;height:2px;width:100%;z-index:90;transform-origin:0 50%;transform:scaleX(0);background:var(--red)}
.demo{background:var(--red);color:#fff;font:600 13px/1.35 var(--body);text-align:center;padding:8px 14px}
.demo a{text-decoration:underline;font-weight:700}

/* nav: floating pill */
.nav{position:sticky;top:12px;z-index:60;width:max-content;max-width:calc(100% - 24px);margin:12px auto 0;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 18px;border-radius:99px;background:rgba(14,18,9,.72);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.08),0 18px 40px -18px #000}
.brand{display:flex;align-items:center;gap:10px;font:800 15px/1 var(--display);letter-spacing:.08em;margin-right:8px;white-space:nowrap}
.seal{width:28px;height:28px;border-radius:7px;background:var(--red);display:grid;place-items:center;color:#fff;font:800 16px/1 "Shippori Mincho",serif;transform:rotate(-5deg)}
.nav ul{display:flex;list-style:none;gap:2px}
.nav ul a{display:block;padding:9px 14px;border-radius:99px;font:500 14px var(--body);color:var(--dim);transition:color .4s var(--ease),background .4s var(--ease)}
.nav ul a:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.lang{display:flex;background:rgba(255,255,255,.06);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--dim);font:600 12px var(--body);padding:7px 10px;border-radius:99px;cursor:pointer;transition:background .4s var(--ease),color .4s var(--ease)}
.lang button[aria-pressed=true]{background:var(--red);color:#fff}
@media(max-width:820px){.nav>.btn{display:none}.nav ul{display:none}.brand span:last-child{display:none}.brand{margin-right:2px}}

.btn{--g:rgba(255,255,255,.18);display:inline-flex;align-items:center;gap:14px;min-height:54px;padding:6px 6px 6px 26px;border-radius:99px;font:600 16px var(--body);border:0;cursor:pointer;white-space:nowrap;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.btn i{width:42px;height:42px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-style:normal;font-size:18px;transition:transform .5s var(--ease)}
.btn:hover i{transform:translate(3px,-2px) scale(1.06)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--red);color:#fff;box-shadow:0 18px 44px -16px rgba(216,52,31,.9)}
.btn.g{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{min-height:42px;padding:4px 4px 4px 18px;font-size:14px;gap:10px}.btn.sm i{width:34px;height:34px;font-size:15px}
.tag{display:inline-block;font:600 11px var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--red);margin-bottom:18px}
section{padding:clamp(70px,10vw,150px) 0}
h1,h2{text-wrap:balance}
h2{font:800 clamp(30px,4.6vw,58px)/1.14 var(--display);max-width:18ch}
html[lang=th] h2{line-height:1.32}

/* hero */
.hero{position:relative;min-height:calc(100dvh - 60px);padding:clamp(30px,5vw,60px) 0 clamp(60px,8vw,100px);display:flex;align-items:center;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,80px);align-items:center}
h1{font:800 clamp(40px,5.6vw,84px)/1.05 var(--display);letter-spacing:-.01em}
html[lang=th] h1{line-height:1.22;font-size:clamp(38px,5vw,72px)}
h1 em{font-style:normal;color:var(--red);display:block}
.lead{margin-top:22px;max-width:36ch;color:#d6d0c0;font-size:clamp(17px,1.8vw,20px)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.stage{position:relative;width:min(430px,100%);margin-inline:auto;padding:0 6%}
.arch{position:relative;aspect-ratio:9/15.5;border-radius:999px 999px 22px 22px;overflow:hidden;box-shadow:0 60px 100px -40px #000,0 0 0 1px rgba(239,233,220,.2);background:#0d1108}
.sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity 1.4s var(--ease),transform 7s linear}.sl.on{opacity:1;transform:scale(1.14)}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,13,6,0) 55%,rgba(10,13,6,.45))}
.ambient{position:absolute;inset:0;overflow:hidden;z-index:0}.ambient img{width:100%;height:100%;object-fit:cover;filter:blur(50px) saturate(1.4) brightness(.4);transform:scale(1.4)}.ambient::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 70% at 30% 50%,rgba(10,13,6,.7),rgba(10,13,6,.2)),linear-gradient(180deg,transparent 70%,var(--bg))}
.hero .wrap{position:relative;z-index:1}
@keyframes kb{to{transform:scale(1.2) translateY(-2%)}}
.enso{position:absolute;inset:-9% -16% -4%;width:132%;height:auto;overflow:visible;pointer-events:none;color:var(--red)}
.enso path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-width:7;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s var(--ease) .3s forwards;filter:url(#rough)}
@keyframes draw{to{stroke-dashoffset:0}}
.kanji{position:absolute;right:-10%;top:-2%;writing-mode:vertical-rl;font:800 clamp(80px,12vw,170px)/1 "Shippori Mincho",serif;color:rgba(239,233,220,.07);letter-spacing:.05em;pointer-events:none;user-select:none}
.hanko{position:absolute;left:0;bottom:10%;z-index:3;width:86px;height:86px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;font:700 11px/1.15 var(--body);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-8deg);box-shadow:0 16px 36px -10px rgba(216,52,31,.8)}
.hanko b{display:block;font:800 22px/1 var(--display);text-transform:none;letter-spacing:0}
@media(max-width:860px){.hero{min-height:calc(100dvh - 150px);align-items:flex-end;padding:0 0 24px}.hero .tag{color:#ffb4a8}.cta .btn.g{display:none}.ambient{display:none}.hero .wrap{grid-template-columns:1fr;position:static}.stage{position:absolute;inset:0;width:auto;padding:0;margin:0;z-index:0}.arch{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;box-shadow:none}.arch::after{background:linear-gradient(180deg,rgba(10,13,6,.55) 0%,rgba(10,13,6,.1) 30%,rgba(10,13,6,.55) 62%,rgba(10,13,6,.95) 100%)}.enso,.kanji{display:none}.hanko{left:auto;right:16px;bottom:auto;top:92px;width:66px;height:66px}.hero .wrap>div:first-child{position:relative;z-index:2;padding-top:260px;width:min(1180px,100% - 40px);margin:0 auto}h1{text-shadow:0 2px 24px rgba(0,0,0,.6)}}

.marq{overflow:hidden;border-block:1px solid var(--line);background:var(--bg2);color:var(--dim);font:500 14px/1 var(--body);letter-spacing:.24em;text-transform:uppercase}
.marq div{display:flex;width:max-content;animation:mq 46s linear infinite;padding:20px 0}
.marq span{padding:0 30px;white-space:nowrap}.marq span::after{content:"/";margin-left:60px;color:var(--red)}
@keyframes mq{to{transform:translateX(-50%)}}

/* manifesto */
.mf{position:relative;overflow:hidden;padding-block:clamp(110px,16vw,240px)}.mf .wrap{position:relative;z-index:1}.mfv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;filter:saturate(1.2) brightness(.85);z-index:0}.mf::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--bg) 0%,rgba(10,13,6,.55) 55%,rgba(10,13,6,.2));pointer-events:none}
.mf p{font:700 clamp(28px,4.8vw,66px)/1.22 var(--display);max-width:22ch;text-wrap:balance}
html[lang=th] .mf p{line-height:1.45}
.mf .w{display:inline-block;margin-right:.26em}
@supports (animation-timeline:view()){.mf .w{opacity:.16;animation:wr linear both;animation-timeline:view();animation-range:entry calc(var(--i)*2.6%) entry calc(26% + var(--i)*2.6%)}@keyframes wr{to{opacity:1}}}

/* promises */
.pr{background:var(--bg2)}.pr .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(24px,6vw,100px);align-items:start}
.pr .sticky{position:sticky;top:110px}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,36px);padding:clamp(26px,4vw,46px) 0;border-top:1px solid var(--line);transition:padding .6s var(--ease)}
.row:last-child{border-bottom:1px solid var(--line)}
.row:hover{padding-left:14px}
.row b{font:800 clamp(46px,6vw,84px)/1 "Shippori Mincho",serif;color:var(--red);opacity:.9}
.row h3{font:700 clamp(21px,2.4vw,30px)/1.3 var(--display);margin-bottom:8px}
.row p{color:var(--dim);max-width:46ch}
@media(max-width:820px){.pr .wrap{grid-template-columns:1fr}.pr .sticky{position:static}}

/* process: drawn ink line */
.pc .steps{view-timeline-name:--st;position:relative;margin-top:clamp(34px,5vw,70px);display:grid;gap:clamp(40px,6vw,80px);padding-left:clamp(46px,7vw,100px)}
.pc .line{position:absolute;left:clamp(12px,2.2vw,26px);top:20px;bottom:20px;width:3px;margin-left:-1px;background:var(--red);transform-origin:50% 0;border-radius:3px}
@supports (animation-timeline:view()){.pc .line{transform:scaleY(0);animation:grow linear both;animation-timeline:--st;animation-range:entry 30% cover 60%}@keyframes grow{to{transform:scaleY(1)}}}
.step{position:relative;max-width:560px}
.step::before{content:"";position:absolute;left:calc(-1*clamp(46px,7vw,100px) + clamp(12px,2.2vw,26px) - 7px);top:12px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3px solid var(--red)}
.step h3{font:700 clamp(22px,2.6vw,34px)/1.25 var(--display);margin-bottom:8px}
.step p{color:var(--dim)}

/* studio gallery: native horizontal scroll */
.sg{background:var(--bg2);padding-bottom:clamp(60px,8vw,110px)}
.sg .hd{margin-bottom:clamp(26px,4vw,50px)}
.sg .hd p{color:var(--dim);margin-top:14px;max-width:46ch}
.rail{justify-content:safe center;display:flex;gap:clamp(14px,2vw,26px);overflow-x:auto;scroll-snap-type:x mandatory;padding:6px max(20px,calc((100vw - 1180px)/2)) 22px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--red) transparent}
.shell{flex:0 0 auto;width:min(74vw,300px);scroll-snap-align:center;padding:7px;border-radius:calc(var(--r) + 7px);background:rgba(255,255,255,.04);box-shadow:0 0 0 1px var(--line)}
.shell:nth-child(even){margin-top:0}.soon .core{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:24px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 12px,transparent 12px 24px);box-shadow:inset 0 0 0 1px rgba(239,233,220,.22);position:relative}.soon .k{position:absolute;right:14px;top:4px;font:800 150px/1 "Shippori Mincho",serif;color:rgba(216,52,31,.45)}.soon h3{font:700 22px/1.3 var(--display);position:relative}.soon .core p{padding:0;position:relative;color:var(--dim)}
.core{border-radius:var(--r);overflow:hidden;aspect-ratio:9/16;background:#0d1108;box-shadow:inset 0 1px 1px rgba(255,255,255,.12)}
.core img{width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(1.05);transition:transform 1.1s var(--ease)}
.shell:hover img{transform:scale(1.06)}
.shell p{padding:12px 6px 4px;font:500 14px var(--body);color:var(--dim)}
.note{margin-top:8px;font-size:14px;color:var(--dim);max-width:62ch;border-left:2px solid var(--red);padding-left:14px}


.mas{columns:4 240px;column-gap:14px}
.mas figure{break-inside:avoid;margin:0 0 14px;position:relative;border-radius:var(--r);overflow:hidden;background:#0d1108;cursor:zoom-in;box-shadow:0 0 0 1px var(--line)}
.mas img{width:100%;height:auto;display:block;transition:transform 1.1s var(--ease)}
.mas figure:hover img{transform:scale(1.05)}
.mas figcaption{position:absolute;left:0;right:0;bottom:0;padding:42px 16px 14px;background:linear-gradient(180deg,transparent,rgba(5,7,3,.85));font:500 14px/1.4 var(--body);color:#efe9dc;transform:translateY(8px);opacity:.9;transition:transform .6s var(--ease)}
.mas figure:hover figcaption{transform:none}
@media(max-width:700px){.mas{columns:2 150px;column-gap:10px}.mas figure{margin-bottom:10px}.mas figcaption{font-size:12px;padding:30px 10px 10px}}
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,7,3,.94);display:flex;align-items:center;justify-content:center;padding:20px}
.lb[hidden]{display:none}body.lbo .nav,body.lbo .bar{display:none}
.lb img{max-width:min(92vw,900px);max-height:84dvh;border-radius:14px;box-shadow:0 40px 100px -20px #000}
.lb p{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#d6d0c0;font:500 15px var(--body)}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.1);color:#fff;width:48px;height:48px;border-radius:50%;font-size:28px;cursor:pointer;line-height:1}
.lbx{top:18px;right:18px}.lbp{left:14px;top:50%}.lbn{right:14px;top:50%}


fieldset{border:0;min-width:0;display:grid;gap:8px}legend{font-size:14px;color:#cfc9b6;margin-bottom:2px}
.chipsel{display:flex;flex-wrap:wrap;gap:8px}
.chipsel button{border:1px solid rgba(239,233,220,.3);background:rgba(0,0,0,.25);color:var(--ink);font:500 15px var(--body);padding:9px 15px;min-height:44px;border-radius:99px;cursor:pointer;transition:background .4s var(--ease),border-color .4s var(--ease),transform .4s var(--ease)}
.chipsel button:active{transform:scale(.96)}
.chipsel button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.bsteps{list-style:none;margin-top:22px;display:grid;gap:10px;color:#d6d0c0;font-size:15px}
.bsteps li{display:flex;gap:12px;align-items:flex-start}.bsteps b{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(216,52,31,.9);color:#fff;display:grid;place-items:center;font:700 13px var(--body)}
.fnote{min-height:1.4em;font-size:14px;color:#e9c9c0}
/* signature: tattooed dolls */
.dl{background:var(--bg)}
.dl .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(24px,6vw,90px);align-items:center}
.dl .tri{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:12px}
.dl .tri figure{margin:0;border-radius:var(--r);overflow:hidden;background:#0d1108;box-shadow:0 0 0 1px var(--line)}
.dl .tri figure:first-child{grid-row:span 2}.dl .tri img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s var(--ease)}
.dl .tri figure:hover img{transform:scale(1.05)}
.dl p.lead{color:var(--dim);margin-top:16px;max-width:40ch}
@media(max-width:820px){.dl .wrap{grid-template-columns:1fr}}
/* FAQ */
.fq{background:var(--bg2)}
.fq details{border-top:1px solid var(--line);padding:0}.fq details:last-child{border-bottom:1px solid var(--line)}
.fq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 4px;font:700 clamp(18px,2vw,22px)/1.4 var(--display)}
.fq summary::-webkit-details-marker{display:none}.fq summary::after{content:"+";flex:none;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font:400 22px var(--body);transition:transform .5s var(--ease),background .5s var(--ease)}
.fq details[open] summary::after{transform:rotate(45deg);background:var(--red)}
.fq details p{padding:0 4px 24px;color:var(--dim);max-width:60ch}
.fq .wrap{max-width:820px}
/* hero trust line */
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;color:#cfc9b6;font-size:14px}.trust span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--red);margin-right:9px;transform:rotate(45deg)}

/* styles: tiles */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(190px,auto);gap:14px;margin-top:clamp(30px,4vw,56px)}
.tile{position:relative;overflow:hidden;border-radius:var(--r);padding:clamp(20px,2.4vw,30px);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:transform .6s var(--ease)}
.tile:hover{transform:translateY(-6px)}
.tile .k{position:absolute;right:14px;top:6px;font:800 clamp(80px,9vw,140px)/1 "Shippori Mincho",serif;opacity:.9;pointer-events:none}
.tile h3{font:700 clamp(20px,2vw,26px)/1.25 var(--display);position:relative}
.tile p{font-size:15px;position:relative;opacity:.85}
.tile:nth-child(1){grid-column:span 3;grid-row:span 2;background:var(--red);color:#fff}.tile:nth-child(1) .k{color:rgba(0,0,0,.28);font-size:clamp(150px,18vw,260px)}
.tile:nth-child(2){grid-column:span 3;background:var(--moss)}.tile:nth-child(2) .k{color:rgba(239,233,220,.1)}
.tile:nth-child(3){grid-column:span 3;background:#050603;box-shadow:inset 0 0 0 1px var(--line)}.tile:nth-child(3) .k{color:rgba(239,233,220,.12)}
.tile:nth-child(4){grid-column:span 2;background:var(--ink);color:#15180d}.tile:nth-child(4) .k{color:rgba(0,0,0,.1)}
.tile:nth-child(5){grid-column:span 2;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}.tile:nth-child(5) .k{color:rgba(239,233,220,.1)}
.tile:nth-child(6){grid-column:span 2;background:var(--moss)}.tile:nth-child(6) .k{color:rgba(239,233,220,.1)}
@media(max-width:820px){.tiles{grid-template-columns:1fr 1fr}.tile:nth-child(n){grid-column:span 1;grid-row:auto}.tile:nth-child(1){grid-column:span 2;min-height:260px}.tile:nth-child(1) .k{font-size:150px}}

/* booking */
.bk{background:var(--bg2)}
.shellb{padding:8px;border-radius:calc(var(--r) + 14px);background:rgba(255,255,255,.04);box-shadow:0 0 0 1px var(--line)}
.coreb{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,70px);align-items:center;border-radius:calc(var(--r) + 6px);padding:clamp(28px,5vw,66px);background:radial-gradient(70% 90% at 100% 0%,rgba(216,52,31,.26),transparent 70%),var(--moss);box-shadow:inset 0 1px 1px rgba(255,255,255,.1)}
.coreb p.lead{color:#d6d0c0}
form{display:grid;gap:10px}
label{font-size:14px;color:#cfc9b6}
input{width:100%;min-height:54px;border-radius:14px;border:1px solid rgba(239,233,220,.3);background:rgba(0,0,0,.28);color:var(--ink);font:500 16px var(--body);padding:0 16px;transition:border-color .4s var(--ease)}
input:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px rgba(216,52,31,.3)}
input::placeholder{color:#8e8a77}
