<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NM Academy</title>
<meta name="description" content="Sites web & Vidéo IA — Websites & AI Video — เว็บไซต์ & วิดีโอ AI">
<meta name="theme-color" content="#04050c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Manrope:wght@400;600;800&family=Noto+Sans+Thai:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04050c;--fg:#f2f4fb;--mute:#9aa3c0;--c:#00e5ff;--v:#7b5cff;--m:#ff3d9a;--gold:#ffc23a;--r:26px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Manrope','Noto Sans Thai',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.go{overflow:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.aur{position:fixed;inset:-20%;z-index:0;pointer-events:none;
 background:
  radial-gradient(40% 35% at 20% 25%,rgba(123,92,255,.42),transparent 70%),
  radial-gradient(35% 30% at 80% 20%,rgba(0,229,255,.28),transparent 70%),
  radial-gradient(40% 35% at 65% 85%,rgba(255,61,154,.26),transparent 70%);
 animation:drift 18s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate3d(3%,-3%,0) rotate(6deg) scale(1.08)}}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
 background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
 background-size:56px 56px;
 -webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
main{position:relative;z-index:2;min-height:100svh;display:grid;align-content:center;justify-items:center;gap:clamp(22px,4vh,40px);padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));text-align:center}
.tag{display:inline-flex;gap:10px;align-items:center;padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#cfd6f0;opacity:0;transform:translateY(12px);animation:up .8s .1s forwards}
.tag i{width:8px;height:8px;border-radius:50%;background:#2dff9a;box-shadow:0 0 0 0 rgba(45,255,154,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(45,255,154,0)}100%{box-shadow:0 0 0 0 rgba(45,255,154,0)}}
@keyframes up{to{opacity:1;transform:none}}
h1{font-weight:800;font-size:clamp(3rem,13vw,9rem);line-height:.92;letter-spacing:-.05em;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .18em;perspective:800px}
h1 .w{display:inline-flex}
h1 .ch{display:inline-block;opacity:0;transform:translateY(60%) rotateX(-80deg) scale(.8);filter:blur(10px);animation:ch .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(.25s + var(--i)*.055s)}
@keyframes ch{to{opacity:1;transform:none;filter:none}}
h1 .nm .ch{background:linear-gradient(180deg,#fff,#b9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .ac .ch{background:linear-gradient(100deg,var(--c),var(--v) 50%,var(--m));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ch .9s cubic-bezier(.2,.9,.2,1) forwards,sheen 5s linear 1.4s infinite;animation-delay:calc(.25s + var(--i)*.055s),0s}
@keyframes sheen{to{background-position:-220% 0}}
.hello{height:2.2em;position:relative;font-family:Fraunces,'Noto Sans Thai',serif;font-style:italic;font-size:clamp(1.5rem,5vw,2.6rem);color:var(--gold);opacity:0;animation:up .8s 1s forwards}
.hello span{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(100%);filter:blur(6px);transition:all .7s cubic-bezier(.2,.9,.2,1)}
.hello span.on{opacity:1;transform:none;filter:none}
.hello span.off{opacity:0;transform:translateY(-100%);filter:blur(6px)}
.sub{max-width:34rem;color:var(--mute);font-size:clamp(.98rem,2.4vw,1.15rem);line-height:1.55;opacity:0;animation:up .8s 1.15s forwards}
.sub b{color:#fff;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,22px);width:min(1020px,100%);perspective:1100px}
.card{--mx:50%;--my:50%;position:relative;display:grid;gap:10px;align-content:center;justify-items:center;padding:clamp(22px,3.4vw,40px) 16px;border-radius:var(--r);text-decoration:none;color:var(--fg);
 border:1px solid rgba(255,255,255,.14);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden;isolation:isolate;
 transform-style:preserve-3d;transition:transform .25s ease-out,border-color .3s,box-shadow .3s;
 opacity:0;transform:translateY(40px) scale(.94);animation:card .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(1.3s + var(--k)*.12s);-webkit-tap-highlight-color:transparent}
@keyframes card{to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;background:radial-gradient(320px circle at var(--mx) var(--my),var(--glow),transparent 60%)}
.card::after{content:"";position:absolute;inset:-2px;z-index:-2;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--glow) 85%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.0;transition:opacity .3s}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.card:hover,.card:focus-visible,.card.rec{border-color:rgba(255,255,255,.4);box-shadow:0 30px 80px -20px var(--glow);outline:0}
.card:hover::before,.card:focus-visible::before{opacity:.55}
.card:hover::after,.card:focus-visible::after,.card.rec::after{opacity:1;animation:spin 3.2s linear infinite}
@keyframes spin{to{--a:360deg}}
.card.fr{--glow:rgba(0,150,255,.9)}.card.en{--glow:rgba(255,61,154,.9)}.card.th{--glow:rgba(255,194,58,.95)}
.code{font-size:.72rem;font-weight:800;letter-spacing:.3em;color:var(--mute)}
.orb{width:clamp(66px,9vw,92px);height:clamp(66px,9vw,92px);border-radius:50%;display:grid;place-items:center;font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800;position:relative;transform:translateZ(40px);
 background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 38%),linear-gradient(145deg,var(--glow),#0b0f33);box-shadow:0 12px 40px -8px var(--glow),inset 0 0 0 1px rgba(255,255,255,.35)}
.orb::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px dashed rgba(255,255,255,.3);animation:rot 14s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.name{font-size:clamp(1.35rem,3vw,1.9rem);font-weight:800;letter-spacing:-.02em;transform:translateZ(30px)}
.card.th .name{font-family:'Noto Sans Thai','Manrope',sans-serif}
.go{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;font-weight:700;color:#dfe5ff;transform:translateZ(20px)}
.go svg{width:16px;height:16px;transition:transform .3s}
.card:hover .go svg{transform:translateX(6px)}
.rectag{position:absolute;top:12px;right:12px;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:#fff;color:#04050c;display:none}
.card.rec .rectag{display:block}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;opacity:0;animation:up .8s 1.9s forwards}
.pills span{padding:7px 14px;border-radius:99px;font-size:.82rem;font-weight:600;color:#cfd6f0;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.foot{font-size:.78rem;color:#6b7392;opacity:0;animation:up .8s 2.1s forwards}
#warp{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(circle at var(--wx,50%) var(--wy,50%),#fff 0,var(--wc,#7b5cff) 22%,#04050c 60%);clip-path:circle(0 at var(--wx,50%) var(--wy,50%));transition:clip-path .75s cubic-bezier(.7,0,.2,1)}
#warp.on{clip-path:circle(150% at var(--wx,50%) var(--wy,50%))}
@media (max-width:720px){
 .cards{grid-template-columns:1fr;gap:12px;width:min(440px,100%)}
 .card{grid-template-columns:auto 1fr auto;justify-items:start;text-align:left;align-items:center;gap:4px 16px;padding:16px 18px}
 .card .orb{grid-row:1/3;width:64px;height:64px;font-size:1.7rem}
 .code{align-self:end}.name{align-self:start}
 .go{grid-row:1/3;grid-column:3}.go span{display:none}
 .rectag{top:8px;right:8px}
}
@media (prefers-reduced-motion:reduce){
 *{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="aur" aria-hidden="true"></div><div class="grid" aria-hidden="true"></div>
<main>
 <div class="tag"><i></i> Sites web · Vidéo IA</div>
 <h1 aria-label="NM Academy"><span class="w nm" id="t1"></span><span class="w ac" id="t2"></span></h1>
 <div class="hello" id="hello" aria-hidden="true"><span class="on">Bonjour</span><span>Hello</span><span>สวัสดี</span></div>
 <p class="sub"><b>Choisis ta langue</b> · Choose your language · <b>เลือกภาษา</b></p>
 <nav class="cards" aria-label="Langue / Language / ภาษา">
  <a class="card fr" style="--k:0" href="vente.html?lang=fr" data-c="#0a84ff"><span class="rectag">★</span><span class="orb">FR</span><span class="code">FRANÇAIS</span><span class="name">Français</span><span class="go"><span>Entrer</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="card en" style="--k:1" href="vente.html?lang=en" data-c="#ff3d9a"><span class="rectag">★</span><span class="orb">EN</span><span class="code">ENGLISH</span><span class="name">English</span><span class="go"><span>Enter</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="card th" style="--k:2" href="vente.html?lang=th" data-c="#ffb020"><span class="rectag">★</span><span class="orb">ไทย</span><span class="code">THAI</span><span class="name">ภาษาไทย</span><span class="go"><span>เข้าสู่เว็บไซต์</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
 </nav>
 <div class="pills"><span>🌐 Crée des sites</span><span>🎬 Vidéo IA</span><span>📱 Mobile-first</span><span>✅ 14 jours satisfait ou remboursé</span></div>
 <p class="foot">NM Studio · Une compétence réelle, pas du rêve.</p>
</main>
<div id="warp"></div>
<script>
(function(){
 // title letters
 function split(id,txt,off){var el=document.getElementById(id);txt.split('').forEach(function(c,i){var s=document.createElement('span');s.className='ch';s.style.setProperty('--i',i+off);s.textContent=c;el.appendChild(s)})}
 split('t1','NM',0);split('t2','ACADEMY',2);

 // greeting rotator
 var hs=[].slice.call(document.querySelectorAll('#hello span')),hi=0;
 setInterval(function(){var o=hs[hi];o.className='off';hi=(hi+1)%hs.length;var n=hs[hi];n.className='';void n.offsetWidth;n.className='on';setTimeout(function(){o.className=''},700)},2300);

 // recommended language from the browser
 var nl=(navigator.language||'fr').slice(0,2).toLowerCase(),rec=document.querySelector('.card.'+(['fr','en','th'].indexOf(nl)>-1?nl:'en'));
 if(rec)rec.classList.add('rec');
 document.documentElement.lang=['fr','en','th'].indexOf(nl)>-1?nl:'fr';

 // card tilt + spotlight (pointer devices)
 var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
 [].forEach.call(document.querySelectorAll('.card'),function(c){
  if(fine){
   c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');c.style.transform='rotateY('+((x-.5)*14)+'deg) rotateX('+((.5-y)*14)+'deg) translateZ(10px)'});
   c.addEventListener('pointerleave',function(){c.style.transform=''});
  }
  // warp transition then navigate
  c.addEventListener('click',function(e){
   if(e.metaKey||e.ctrlKey||e.shiftKey)return;
   e.preventDefault();
   var w=document.getElementById('warp'),r=c.getBoundingClientRect();
   w.style.setProperty('--wx',(r.left+r.width/2)+'px');w.style.setProperty('--wy',(r.top+r.height/2)+'px');w.style.setProperty('--wc',c.dataset.c);
   document.body.classList.add('go');w.classList.add('on');
   try{localStorage.setItem('nmLang',c.className.match(/\b(fr|en|th)\b/)[1])}catch(_){}
   setTimeout(function(){location.href=c.href},620);
  });
 });
 window.addEventListener('pageshow',function(ev){if(ev.persisted){document.getElementById('warp').classList.remove('on');document.body.classList.remove('go')}});

 // particle constellation that reacts to pointer
 var cv=document.getElementById('fx'),cx=cv.getContext('2d'),W,H,D=Math.min(devicePixelRatio||1,2),P=[],mx=-999,my=-999,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 function size(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);var n=Math.round(Math.min(90,W*H/16000));P=[];for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6,h:[190,255,325][i%3]})}
 size();addEventListener('resize',size);
 addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY},{passive:true});
 addEventListener('pointerleave',function(){mx=my=-999});
 var vis=true;document.addEventListener('visibilitychange',function(){vis=!document.hidden;if(vis)requestAnimationFrame(tick)});
 function tick(){
  if(!vis)return;
  cx.clearRect(0,0,W,H);
  for(var i=0;i<P.length;i++){
   var p=P[i];
   var dx=p.x-mx,dy=p.y-my,d=dx*dx+dy*dy;
   if(d<22000){var f=(1-d/22000)*.6;p.vx+=dx/Math.sqrt(d+1)*f*.08;p.vy+=dy/Math.sqrt(d+1)*f*.08}
   p.vx*=.995;p.vy*=.995;
   p.x+=p.vx;p.y+=p.vy;
   if(p.x<-10)p.x=W+10;else if(p.x>W+10)p.x=-10;if(p.y<-10)p.y=H+10;else if(p.y>H+10)p.y=-10;
   cx.beginPath();cx.fillStyle='hsla('+p.h+',100%,70%,.9)';cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
   for(var j=i+1;j<P.length;j++){var q=P[j],ax=p.x-q.x,ay=p.y-q.y,dd=ax*ax+ay*ay;if(dd<14000){cx.strokeStyle='hsla('+p.h+',100%,70%,'+(.22*(1-dd/14000))+')';cx.lineWidth=.7;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
  }
  if(!calm)requestAnimationFrame(tick);
 }
 tick();
})();
</script>
</body>
</html>
