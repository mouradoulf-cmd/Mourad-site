<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portiva — Creative Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) {
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    };
  }
</script>
<style>
  html, body { font-family: 'Inter', sans-serif; overflow-x: hidden; }

  .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(100%);
    transition: opacity .55s cubic-bezier(.22,.61,.36,1), transform .55s cubic-bezier(.22,.61,.36,1);
  }
  .word.is-visible { opacity: 1; transform: translateY(0); }

  .fade-target {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .fade-target.is-visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body class="bg-black text-white">

<video autoplay loop muted playsinline class="fixed inset-0 -z-10 h-full w-full object-cover pointer-events-none">
  <source src="https://cdn.sceneai.art/Hero%20section%20video%20file%20(2)/13c2a27f-30ac-44f1-866d-94fca9c614d7.mp4" type="video/mp4">
</video>

<header class="fixed inset-x-0 top-0 z-20 flex items-center justify-between px-6 py-6 md:px-10">
  <span class="text-2xl font-medium text-white">Portiva</span>

  <nav class="hidden items-center gap-8 text-sm text-white md:flex fade-target" data-fade>
    <a href="#" class="hover:opacity-70">About</a>
    <a href="#" class="hover:opacity-70">Brands</a>
    <a href="#" class="hover:opacity-70">Careers</a>
    <a href="#" class="hover:opacity-70">Partners</a>
  </nav>

  <button class="rounded-full bg-white px-5 py-2.5 text-sm font-medium text-black fade-target" data-fade>
    Chat with us
  </button>
</header>

<main class="relative z-10 flex min-h-[100svh] flex-col justify-center px-6 pt-24 md:px-10">
  <div class="max-w-2xl">
    <p class="fade-target mb-4 text-sm text-white" data-fade>| Creative Agency</p>

    <h1 class="font-semibold leading-[1.1] text-white text-4xl sm:text-5xl md:text-[62px]">
      <span class="block overflow-hidden pb-1"><span class="word">Less</span> <span class="word">complexity,</span></span>
      <span class="block overflow-hidden pb-1"><span class="word">more</span> <span class="word">impact</span> <span class="word">in</span></span>
      <span class="block overflow-hidden pb-1"><span class="word">every</span> <span class="word">project.</span></span>
    </h1>

    <div class="fade-target mt-7 flex items-center gap-3" data-fade>
      <div class="flex items-center gap-1" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#c25e2e"><path d="M12 2.5l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.6l-6.2 3.6 1.6-6.9-5.3-4.7 7-.7Z"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#c25e2e"><path d="M12 2.5l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.6l-6.2 3.6 1.6-6.9-5.3-4.7 7-.7Z"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#c25e2e"><path d="M12 2.5l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.6l-6.2 3.6 1.6-6.9-5.3-4.7 7-.7Z"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#c25e2e"><path d="M12 2.5l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.6l-6.2 3.6 1.6-6.9-5.3-4.7 7-.7Z"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#c25e2e"><path d="M12 2.5l2.9 6.4 7 .7-5.3 4.7 1.6 6.9L12 17.6l-6.2 3.6 1.6-6.9-5.3-4.7 7-.7Z"/></svg>
      </div>
      <span class="text-sm text-white">3000+ Customers</span>
    </div>

    <div class="fade-target mt-8 flex flex-wrap items-center gap-4" data-fade>
      <button class="flex items-center gap-3 rounded-full bg-white py-1.5 pl-5 pr-1.5 text-sm font-medium text-black">
        Chat With Us
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-black text-white">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </button>
      <button class="rounded-full border border-white/30 bg-white/10 px-5 py-2.5 text-sm font-medium text-white backdrop-blur-sm">
        Our Works
      </button>
    </div>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var words = document.querySelectorAll('.word');
    words.forEach(function (w, i) {
      setTimeout(function () { w.classList.add('is-visible'); }, i * 120);
    });

    var fadeTargets = document.querySelectorAll('[data-fade]');
    setTimeout(function () {
      fadeTargets.forEach(function (el) { el.classList.add('is-visible'); });
    }, 260);
  });
</script>

</body>
</html>
